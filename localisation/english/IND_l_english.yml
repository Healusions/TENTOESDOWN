 IND_neutrality_party:0 "Continuity Council"
 IND_neutrality_party_long:0 "Harrison Continuity Council"
 IND_fascism_party:0 "Silver Legion"
 IND_fascism_party_long:0 "Silver Legion of America"
 IND_communism_party:0 "Wabash Congress"
 IND_communism_party_long:0 "Congress of Indiana Workers"

 IND_paul_v_mcnutt:0 "Paul V. McNutt"
 IND_paul_v_mcnutt_desc:0 "Born in Franklin in 1891, Paul Vories McNutt studied at Indiana University and Harvard Law School, served in the Army during the Great War, and rose through the American Legion before winning the governorship in 1932. His Executive Reorganization Act compressed 169 agencies into eight departments under the Governor. Critics answer that achievement with the Two Percent Club: patronage employees assessed for the Democratic organization. McNutt is capable, ambitious, and convinced that Indiana works best when every line of authority reaches his office."
 IND_paul_v_mcnutt_leader_desc:0 "Born in Franklin in 1891, Paul Vories McNutt studied at Indiana University and Harvard Law School, served in the Army during the Great War, and rose through the American Legion before winning the governorship in 1932. His Executive Reorganization Act compressed 169 agencies into eight departments under the Governor. Critics answer that achievement with the Two Percent Club: patronage employees assessed for the Democratic organization. McNutt is capable, ambitious, and convinced that Indiana works best when every line of authority reaches his office."
 IND_frank_m_mchale:0 "Frank M. McHale"
 IND_frank_m_mchale_desc:0 "McNutt's lawyer and principal political organizer. McHale manages county chairmen, convention delegates, and the patronage organization; he does not pretend to be an economist."
 IND_wendell_willkie:0 "Wendell Willkie"
 IND_wendell_willkie_desc:0 "Born in Elwood and trained at the Indiana University School of Law, Willkie now runs Commonwealth & Southern from New York. His fight over the Tennessee Valley Authority made him a national spokesman for private utilities and a practiced opponent of federal administrative power. McNutt wants his lawyers, credit contacts, and public credibility; Willkie will help Indiana without joining McHale's patronage organization."
 IND_harrison_continuity_council:0 "Harrison Regency Council"
 IND_harrison_continuity_council_desc:0 "The Harrison Regency Council is not a single claimant. It is the committee created by the Continuity Act to hold executive authority in the Harrison name until a succession convention can meet. Legislators supply the statute, Guard officers enforce the seal, and the subscribers behind Consortium Credit keep the Treasury open. Their agreement is strongest on one point: none intends to return the Statehouse to ordinary party government."
 IND_harrison_continuity_council_leader_desc:0 "The Harrison Regency Council is not a single claimant. It is the committee created by the Continuity Act to hold executive authority in the Harrison name until a succession convention can meet. Legislators supply the statute, Guard officers enforce the seal, and the subscribers behind Consortium Credit keep the Treasury open. Their agreement is strongest on one point: none intends to return the Statehouse to ordinary party government."
 IND_william_dudley_pelley:0 "William Dudley Pelley"
 IND_william_dudley_pelley_desc:0 "William Dudley Pelley was a journalist, screenwriter, and religious publisher before founding the Silver Legion in 1933. His organization joined authoritarian politics to conspiratorial mysticism and open antisemitism. In Indiana he avoided a mass march: copied political files, privately recruited lodges, and a replaced Statehouse watch brought him into office. The administration he now leads is narrow, suspicious, and dependent on the compromised officials it claims to have purified."
 IND_william_dudley_pelley_leader_desc:0 "William Dudley Pelley was a journalist, screenwriter, and religious publisher before founding the Silver Legion in 1933. His organization joined authoritarian politics to conspiratorial mysticism and open antisemitism. In Indiana he avoided a mass march: copied political files, privately recruited lodges, and a replaced Statehouse watch brought him into office. The administration he now leads is narrow, suspicious, and dependent on the compromised officials it claims to have purified."
 IND_powers_hapgood:0 "Powers Hapgood"
 IND_powers_hapgood_desc:0 "Powers Hapgood left a privileged Indianapolis family for the mines and spent his adult life inside the labor movement. He worked underground, joined union drives across several states, and treated arrest as an occupational cost. Terre Haute gave him what national organizations rarely did: committees with addresses, food stores, railroad contacts, and men accustomed to acting without permission. The civil war made those committees a government. Hapgood must now prove they can administer the state they fought to create."
 IND_powers_hapgood_leader_desc:0 "Powers Hapgood left a privileged Indianapolis family for the mines and spent his adult life inside the labor movement. He worked underground, joined union drives across several states, and treated arrest as an occupational cost. Terre Haute gave him what national organizations rarely did: committees with addresses, food stores, railroad contacts, and men accustomed to acting without permission. The civil war made those committees a government. Hapgood must now prove they can administer the state they fought to create."

 STATE_1082:0 "Calumet"
 STATE_1083:0 "Northeast Indiana"
 STATE_1084:0 "Southern Indiana"
 VICTORY_POINTS_6713:0 "Gary"
 VICTORY_POINTS_11637:0 "Fort Wayne"
 VICTORY_POINTS_9654:0 "South Bend"
 VICTORY_POINTS_11635:0 "Evansville"
 VICTORY_POINTS_12437:0 "Terre Haute"

 IND_state_in_suspension:0 "A State in Suspension"
 IND_state_in_suspension_desc:0 "Indiana's centralized departments still issue orders, but the legal theory beneath them ends at a federalization notice Indianapolis refuses to acknowledge. The Two Percent Club keeps the payroll organization loyal while McNutt's approaching departure makes every appointment conditional."
 IND_wabash_emergency:0 "The Wabash Emergency"
 IND_wabash_emergency_desc:0 "The 1935 Terre Haute strike ended after forty-eight hours; martial law did not. The Guard holds the courthouse and telephone exchange while unions and relief committees preserve an organization beneath the occupation."
 IND_federal_embargo:0 "The Federal Embargo"
 IND_federal_embargo_desc:0 "There is no customs wall around Indiana. Railroad certificates, bank clearances, insurance forms, and federal contracts are simply delayed in different offices. Gary waits for ore, Allison waits for buyers, and no single concession can release every shipment."
 IND_consortium_credit:0 "Consortium Credit"
 IND_consortium_credit_desc:0 "A Chicago syndicate renews the short-term notes keeping Indiana's payroll current. The public contract names one holding company; the renewals pass through several banks, utilities, and Indianapolis intermediaries."

 IND_mcnutt_government:0 "The McNutt Administration"
 IND_mcnutt_government_desc:0 "The Indiana Democrats retained the Statehouse through a contested convention. McHale still runs the party organization, while Willkie advises on utilities, credit, and the federal campaign from outside it."
 IND_harrison_regency:0 "The Harrison Regency"
 IND_harrison_regency_desc:0 "The Continuity Act placed the Harrison name above the executive departments and called the arrangement a regency pending convention. The 1816 Society holds the notes, the Assembly holds the petition, and the Guard holds the Statehouse."
 IND_silver_administration:0 "The Silver Administration"
 IND_silver_administration_desc:0 "Pelley's government rests on copied obligations, converted county chairmen, and a Statehouse detail selected before the proclamation. The Silver Legion possesses Indiana's offices; it has not made their occupants trust one another."
 IND_wabash_provisional_government:0 "The Wabash Provisional Government"
 IND_wabash_provisional_government_desc:0 "The Wabash Congress claims authority through strike committees, mine locals, and Calumet delegates. Its first test is not doctrine but control of rail lines, courthouses, and armed columns."

 IND_consortium_disclosed:0 "The Disclosed Consortium"
 IND_consortium_disclosed_desc:0 "Indiana published the names behind its emergency credit. Public scrutiny steadies the government, but lenders now demand safer terms before financing state construction."
 IND_consortium_chartered:0 "The Chartered Consortium"
 IND_consortium_chartered_desc:0 "The 1816 Society has exchanged secrecy for a legal charter and a permanent place beside the Treasury. Credit moves quickly; public authority does not."
 IND_consortium_seized:0 "The Seized Consortium"
 IND_consortium_seized_desc:0 "The Silver administration confiscated the ledgers and kept the network intact. Its money now answers to Indianapolis through men who know exactly how replaceable they are."
 IND_consortium_nationalized:0 "The Indiana Credit Board"
 IND_consortium_nationalized_desc:0 "The Wabash government converted the consortium's claims into a public credit board. The machinery remains; the ownership notices have changed."

 IND_federal_standoff:0 "The Federal Standoff"
 IND_federal_standoff_desc:0 "Indiana has broken the worst freight holds, but Washington still obstructs credit and recognition. Both governments avoid the order that would turn administrative coercion into open war."
 IND_purdue_state_program:0 "The Purdue State Program"
 IND_purdue_state_program_desc:0 "Karl Lark-Horovitz's instrument shops at West Lafayette receive state priority and a protected appropriation. The arrangement accelerates laboratories that can justify their work to the committee and makes secrecy another charge against Indiana's economy."
 IND_west_lafayette_understanding:0 "The West Lafayette Understanding"
 IND_west_lafayette_understanding_desc:0 "Purdue's accelerator program remains under university ownership with published accounts and a narrow inspection agreement. Indianapolis receives the research without taking sole custody of the laboratory."
 IND_special_services_without_agency:0 "The Special Services Section"
 IND_special_services_without_agency_desc:0 "A small office in the Adjutant General's building collates railroad reports, State Police files, and intercepted federal procurement notices. It gives Indiana one address for information previously scattered across departments."

 IND_calumet_fieldworks:0 "Calumet Fieldworks"
 IND_calumet_fieldworks_desc:0 "Survey crews marked the road embankments, drainage cuts, and industrial approaches between Hammond and Gary. Guard companies have prepared positions before federal troops arrive."
 IND_washington_moves_first:0 "Washington Must Move First"
 IND_washington_moves_first_desc:0 "Indiana's orders at Hammond are written to remain civil until federal forces break the inspection line. The distinction matters to newspapers, undecided officers, and the men asked to hold their ground."
 IND_federal_line_victory:0 "The Federal Line Held"
 IND_federal_line_victory_desc:0 "Federal columns withdrew into Illinois without reopening the Hammond corridor. Indiana's Guard has won a battle against a much larger power and acquired the confidence—and dangerous expectations—that follow."
 IND_federal_supervision:0 "Federal Supervision Commission"
 IND_federal_supervision_desc:0 "A joint commission now reviews Indiana freight certificates, Guard deployments, and emergency borrowing. The fighting stopped; federal leverage returned in administrative form."
 IND_federal_humiliation:0 "The Lost Indiana Operation"
 IND_federal_humiliation_desc:0 "Washington committed regular formations to a supposedly routine enforcement action and failed to reopen a single Indiana inspection post. Investigations, appropriations fights, resignations, and public doubt now reach far beyond the units that withdrew from Illinois."
 IND_indiana_on_level_ground:0 "Indiana on Level Ground"
 IND_indiana_on_level_ground_desc:0 "The departments hold current commissions, civil government has returned to Terre Haute, the Chicago notes have been answered, and the federal enforcement campaign has ended. Indianapolis can finally plan beyond the next emergency."
 IND_hoosier_general_staff:0 "The Hoosier General Staff"
 IND_hoosier_general_staff_desc:0 "Officers from the Guard, the federal line, and the Wabash fighting now work from one mobilization plan and one table of organization."
 IND_open_consulates:0 "Open Consulates"
 IND_open_consulates_desc:0 "Small Indiana missions handle trade papers, stranded citizens, and unofficial talks in neighboring capitals. They are modest offices, but they give Indianapolis contacts independent of Washington."
 IND_mcnutt_reform_cabinet:0 "The Reform Cabinet"
 IND_mcnutt_reform_cabinet_desc:0 "McNutt has separated economic administration from McHale's party office and placed convention reformers beside veteran department heads."
 IND_regency_charter:0 "The Regency Charter"
 IND_regency_charter_desc:0 "The council's temporary powers, succession procedure, and financial obligations now rest in a published charter rather than emergency proclamations."
 IND_silver_county_system:0 "The Silver County System"
 IND_silver_county_system_desc:0 "County commissioners receive direct authority from Indianapolis in return for political reports, recruitment quotas, and public loyalty to the Silver administration."
 IND_wabash_local_councils:0 "The Congress of Locals"
 IND_wabash_local_councils_desc:0 "Mine locals, railroad brotherhoods, relief committees, and municipal councils now send delegates into a permanent state congress."

 IND_a_state_in_suspension:0 "A State in Suspension"
 IND_a_state_in_suspension_desc:0 "The disputed Guard order, the Terre Haute occupation, and the Chicago note now threaten the succession itself. Before Indiana can answer Washington, somebody must hold Indianapolis."

 IND_keep_the_indiana_democrats:0 "Keep the Indiana Democrats"
 IND_keep_the_indiana_democrats_desc:0 "McNutt will not surrender the Statehouse to creditors, mystics, or committees from Terre Haute. The Machine must submit itself to a public convention and prove that it can still govern."
 IND_keep_the_indiana_democrats_tt:0 "The Harrison, Silver, and Wabash claims will be refused. §YThe State Convention§! begins with §Y10 Political Control§!."
 IND_the_harrison_offer:0 "The Harrison Offer"
 IND_the_harrison_offer_desc:0 "The 1816 Society proposes a continuity government built around the Harrison name. It offers solvency, ceremony, and an American crown assembled from notes, petitions, and Guard orders."
 IND_the_harrison_offer_tt:0 "McNutt, Pelley, and Hapgood will be set aside. §YThe Continuity Campaign§! begins with §Y10 Political Control§!."
 IND_the_silver_entry:0 "The Silver Entry"
 IND_the_silver_entry_desc:0 "Pelley's office has obtained copies from the remains of D. C. Stephenson's organization. The Silver Shirts will enter Indianapolis through county committees, payroll obligations, and doors opened from inside."
 IND_the_silver_entry_tt:0 "McNutt, Harrison, and Wabash alternatives will close. §YThe Silver Entry§! begins with §Y10 Political Control§!."
 IND_the_wabash_answer:0 "The Wabash Answer"
 IND_the_wabash_answer_desc:0 "Powers Hapgood and the surviving Terre Haute committees reject both the Machine and its creditors. They will organize through relief kitchens, mine roads, and an armed challenge to Indianapolis."
 IND_the_wabash_answer_tt:0 "McNutt, Harrison, and Pelley will be rejected. §YPreparing the Congress§! begins with §Y10 Political Control§! and will culminate in §Rcivil war§!."

 IND_the_machine_in_daylight:0 "The Machine in Daylight"
 IND_the_machine_in_daylight_desc:0 "McHale will disclose the delegate count, county assessments, and payroll officers responsible for collecting them. The convention can defend the organization only after learning what it is."
 IND_the_machine_in_daylight_tt:0 "§YOpen the Machine Books§! and §YRecruit Precinct Captains§! become available."
 IND_bring_willkie_home:0 "Bring Willkie Home"
 IND_bring_willkie_home_desc:0 "As president of Commonwealth & Southern, Wendell Willkie has utility lawyers, national credit contacts, and experience fighting federal agencies in public. McNutt will offer him an economic commission kept outside McHale's party office."
 IND_bring_willkie_home_tt:0 "§YWendell Willkie§! becomes available as an advisor. §YBring Willkie to the Table§! becomes available."
 IND_the_1936_state_convention:0 "The 1936 State Convention"
 IND_the_1936_state_convention_desc:0 "County delegations will vote on McNutt's leadership, the disclosed assessments, and a recovery commission chaired from outside the party organization. Willkie will speak for the economic program, not for the Machine."
 IND_the_1936_state_convention_tt:0 "§YHold the State Convention§! becomes available."
 IND_mcnutt_holds_the_statehouse:0 "McNutt Holds the Statehouse"
 IND_mcnutt_holds_the_statehouse_desc:0 "The convention has renewed McNutt's leadership and separated the recovery commission from McHale's party office. The arrangement is cooperation, not a duopoly."
 IND_mcnutt_holds_the_statehouse_tt:0 "Paul V. McNutt remains Governor. Adds §YThe McNutt Administration§!."

 IND_accounts_behind_the_flag:0 "Accounts Behind the Flag"
 IND_accounts_behind_the_flag_desc:0 "Before a Harrison can be proclaimed, the men paying for continuity must commit their names and money. The 1816 Society will learn what its symbolism costs."
 IND_accounts_behind_the_flag_tt:0 "§YAssemble the Guarantors§! and §YSubscribe the Columbia Club§! become available."
 IND_the_harrison_name:0 "The Harrison Name"
 IND_the_harrison_name_desc:0 "No living prince is required yet. A petition can establish the name as Indiana's guarantor while the council decides who may eventually inherit it."
 IND_the_harrison_name_tt:0 "§YCirculate the Harrison Petition§! becomes available."
 IND_orders_to_the_adjutant_general:0 "Orders to the Adjutant General"
 IND_orders_to_the_adjutant_general_desc:0 "A constitutional fiction becomes a government only when the Guard accepts its signature. The council will secure the Statehouse before it announces the regency."
 IND_orders_to_the_adjutant_general_tt:0 "§YSecure Guard Oaths§! becomes available."
 IND_an_american_crown:0 "An American Crown"
 IND_an_american_crown_desc:0 "Indiana will call the arrangement temporary, constitutional, and native to the state. Its creditors know it as continuity; its Guard knows whose orders now carry the seal."
 IND_an_american_crown_tt:0 "The §YHarrison Regency Council§! assumes the executive departments. Adds §YThe Harrison Regency§!."

 IND_a_letter_from_asheville:0 "A Letter from Asheville"
 IND_a_letter_from_asheville_desc:0 "Pelley offers no parade. His first package contains names, debts, and instructions for approaching men who already fear exposure."
 IND_a_letter_from_asheville_tt:0 "§YRecruit Silver Lodges§! and §YTurn a Machine Clerk§! become available."
 IND_a_sermon_for_indianapolis:0 "A Sermon for Indianapolis"
 IND_a_sermon_for_indianapolis_desc:0 "The message will be rewritten for each audience: moral renewal for churches, order for businessmen, and protection for compromised county chairmen."
 IND_a_sermon_for_indianapolis_tt:0 "§YDistribute Tailored Sermons§! becomes available."
 IND_the_night_detail:0 "The Night Detail"
 IND_the_night_detail_desc:0 "The men who lock the Statehouse know which offices matter and which entrances the morning shift never watches. Pelley's followers will replace them quietly."
 IND_the_night_detail_tt:0 "§YReplace the Statehouse Watch§! becomes available."
 IND_the_silver_state:0 "The Silver State"
 IND_the_silver_state_desc:0 "No column has marched on Indianapolis. By the time Pelley appears on the steps, the files, chairmen, and night detail already answer to him."
 IND_the_silver_state_tt:0 "William Dudley Pelley takes the Statehouse. Adds §YThe Silver Administration§!."

 IND_the_house_on_north_eighth:0 "The House on North Eighth"
 IND_the_house_on_north_eighth_desc:0 "Terre Haute's relief committees survived because addresses and duties were kept simple. Hapgood will rebuild the network from the kitchen outward."
 IND_the_house_on_north_eighth_tt:0 "§YPrint the Strike Bulletin§! and §YOrganize Railroad Cells§! become available."
 IND_the_mine_roads:0 "The Mine Roads"
 IND_the_mine_roads_desc:0 "The Guard watches the courthouse and rail depots. It cannot watch every road between Brazil, Clinton, and the mining camps."
 IND_the_mine_roads_tt:0 "§YArm the Mine-Road Caches§! becomes available."
 IND_the_calumet_vote:0 "The Calumet Vote"
 IND_the_calumet_vote_desc:0 "Gary and East Chicago will not be ordered into an uprising planned downstate. Their delegates must vote, and their locals must know what they are promising."
 IND_the_calumet_vote_tt:0 "§YRaise the Calumet Militia§! becomes available."
 IND_the_wabash_congress:0 "The Wabash Congress"
 IND_the_wabash_congress_desc:0 "The committees will meet as a government and force Indianapolis to answer. The democratic command will hold the capital and a broad share of Indiana; prepared militia must end the war quickly."
 IND_the_wabash_congress_tt:0 "Begins a §Rcivil war§!. The democratic command receives Indianapolis and approximately §Y55% of Indiana§!. Prepared formations join the Wabash army."

 IND_political_control_requirement_tt:0 "Requires §Y70 Political Control§!."

 IND_the_emergency_outlives_the_governor:0 "The Files Remain Open"
 IND_the_emergency_outlives_the_governor_desc:0 "Department heads want valid commissions, Vigo County remains under an emergency order, and the next Chicago note matures before winter. Each matter can be taken up separately; none will close itself."
 IND_inventory_the_eight_departments:0 "Inventory the Eight Departments"
 IND_inventory_the_eight_departments_desc:0 "Auditors will identify which commissions rest on McNutt's disputed order, which employees draw assessed salaries, and which offices can continue while new authority is prepared."
 IND_close_the_vigo_file:0 "Close the Vigo File"
 IND_close_the_vigo_file_desc:0 "With the courthouse inventoried and a civil authority ready to receive it, the emergency order can finally be withdrawn."
 IND_reissue_the_payroll_orders:0 "Reissue the Payroll Orders"
 IND_reissue_the_payroll_orders_desc:0 "Fresh commissions will be issued department by department. Employees may keep their party loyalties, but their legal authority will come from the government now sitting in Indianapolis."
 IND_send_the_civil_commission:0 "Send the Civil Commission"
 IND_send_the_civil_commission_desc:0 "Judges, city officers, union representatives, and Guard quartermasters will meet in Terre Haute to inventory prisoners, weapons, buildings, and claims arising from the occupation."
 IND_trace_the_chicago_note:0 "Trace the Chicago Note"
 IND_trace_the_chicago_note_desc:0 "The Treasurer's copy names a holding company and a maturity date. Bank clearances and warrant numbers will show where the money actually entered Indiana's accounts."
 IND_follow_the_utility_accounts:0 "Follow the Utility Accounts"
 IND_follow_the_utility_accounts_desc:0 "The renewals pass through utility subsidiaries with no obvious interest in the state payroll. Public Service Commission filings may reveal who guaranteed them."
 IND_open_the_chicago_ledger:0 "Open the Chicago Ledger"
 IND_open_the_chicago_ledger_desc:0 "Auditors now have the banks, utility subsidiaries, and Indianapolis signatories on one schedule. The government can publish, charter, seize, or nationalize the network with full knowledge of what it is taking."
 IND_indiana_signs_its_own_orders:0 "Indiana Signs Its Own Orders"
 IND_indiana_signs_its_own_orders_desc:0 "The departments hold current commissions, civil officers control the Terre Haute courthouse, and the Chicago notes have new terms. Federal freight enforcement is now the only authority operating inside Indiana without Indianapolis's consent."
 IND_contest_the_freight_holds:0 "Contest the Freight Holds"
 IND_contest_the_freight_holds_desc:0 "State purchasing agents will consolidate delayed certificates, reroute essential cargo, and place Indiana inspectors at the Hammond rail approaches. Washington must either tolerate the new procedure or enforce its objections in person."

 IND_the_special_services_section:0 "The Special Services Section"
 IND_the_special_services_section_desc:0 "The Chicago inquiry produced bank records, railroad correspondence, and names appearing in State Police files. A small office in the Adjutant General's building will preserve the index and continue the work."
 IND_the_special_services_section_tt:0 "Creates an intelligence agency with §YLa Résistance§!. Without it, grants an equivalent national spirit."
 IND_whispers_from_west_lafayette:0 "Whispers from West Lafayette"
 IND_whispers_from_west_lafayette_desc:0 "A Purdue physicist has asked why federal purchasing officers are quietly collecting the same instruments Indiana cannot move by rail. The answer belongs in a closed room."
 IND_whispers_from_west_lafayette_tt:0 "Karl Lark-Horovitz will report his findings to Indianapolis."
 IND_keep_the_furnaces_lit:0 "Keep the Furnaces Lit"
 IND_keep_the_furnaces_lit_desc:0 "The Gary mills survived the embargo by rationing inputs and idling furnaces. Long-term state orders can return one line to continuous production."
 IND_keep_the_furnaces_lit_tt:0 "Adds §Y1 Military Factory§! in Calumet."
 IND_the_west_lafayette_memorandum:0 "The West Lafayette Memorandum"
 IND_the_west_lafayette_memorandum_desc:0 "The laboratory wants protected procurement, machine time, and authority to stop explaining certain purchases in open correspondence."
 IND_the_west_lafayette_memorandum_tt:0 "Decides whether Purdue's accelerator work becomes a secret state program or a supervised university project."

 IND_survey_the_calumet_approaches:0 "Survey the Calumet Approaches"
 IND_survey_the_calumet_approaches_desc:0 "The roads from Illinois narrow between rail embankments, drainage cuts, factories, and built-up blocks before reaching Gary. Engineers can turn that geography into prepared defensive positions."
 IND_recall_the_38th:0 "Recall the 38th"
 IND_recall_the_38th_desc:0 "The 38th Division's officers know federal drill and Indiana roads. Recalled cadres will form a State Line regiment at Gary while the existing divisions remain available for the rest of the frontier."
 IND_stockpile_the_monon_yards:0 "Stockpile the Monon Yards"
 IND_stockpile_the_monon_yards_desc:0 "Rifles, artillery ammunition, coal, and medical stores can be dispersed among the Monon and Pennsylvania Railroad yards before federal inspectors begin closing sidings."
 IND_make_washington_move_first:0 "Make Washington Move First"
 IND_make_washington_move_first_desc:0 "Indiana's inspectors will remain unarmed in the first rank and the Guard will stay behind marked state lines. If federal troops clear Hammond by force, newspapers will know which government gave the order."
 IND_the_hammond_inspection:0 "The Hammond Inspection"
 IND_the_hammond_inspection_desc:0 "A federal freight train carrying seized Indiana cargo is due through Illinois. State inspectors will stop it at Hammond and refuse the federal marshal's demand to clear the line. Washington has prepared an emergency column across the border."
 IND_the_hammond_inspection_tt:0 "Begins a §Ylimited border conflict§! along the Illinois–Calumet line. No state changes hands. Federal forces enter with §Y4 emergency brigades§!; every completed preparation improves Indiana's position."
 IND_the_state_on_level_ground:0 "The State on Level Ground"
 IND_the_state_on_level_ground_desc:0 "Emergency government has become ordinary government. Indiana can now budget for years, train an army for more than one line, and speak abroad without every conversation returning to recognition."

 IND_an_indiana_works_program:0 "An Indiana Works Program"
 IND_an_indiana_works_program_desc:0 "Road, drainage, school, and municipal contracts will be consolidated into a state works schedule. The first appropriation will expand the industrial belt around Indianapolis."
 IND_allison_studebaker_and_gary:0 "Engines, Trucks, and Steel"
 IND_allison_studebaker_and_gary_desc:0 "Aircraft engines in Indianapolis, vehicle works in South Bend, and steel in Gary give Indiana the beginnings of an integrated armaments economy. Purchasing standards will connect them."
 IND_industrial_mobilization_bonus:0 "Integrated Indiana Industry"

 IND_a_guard_worth_the_name:0 "A Guard Worth the Name"
 IND_a_guard_worth_the_name_desc:0 "The old organization mixed ceremonial units, strike duty, and federal tables never designed for an independent state. New training establishments will begin with weapons already in store."
 IND_lessons_of_the_federal_line:0 "Lessons of the Federal Line"
 IND_lessons_of_the_federal_line_desc:0 "Staff officers will study the movement of small formations through Calumet's industrial terrain, the failures of federal supply, and the point at which local command mattered more than numbers."
 IND_federal_line_doctrine_bonus:0 "Lessons of the Federal Line"
 IND_the_hoosier_general_staff:0 "The Hoosier General Staff"
 IND_the_hoosier_general_staff_desc:0 "Mobilization, rail allocation, procurement, and field planning must reach the same table before the next emergency begins."

 IND_consulates_on_the_river:0 "Consulates on the River"
 IND_consulates_on_the_river_desc:0 "Indiana merchants already maintain agents in Chicago, Louisville, Cincinnati, and Detroit. Giving those offices consular duties provides a practical foreign service before anyone agrees what to call it."
 IND_a_place_between_powers:0 "A Place Between Powers"
 IND_a_place_between_powers_desc:0 "Indiana cannot outbid the great powers. It can offer machine tools, inland routes, technical exchange, and a government whose commitments are not written in Washington."
 IND_the_hoosier_mission:0 "The Hoosier Mission"
 IND_the_hoosier_mission_desc:0 "A permanent mission abroad will carry trade officers, military observers, and authority to negotiate assistance where Indiana's interests require it."

 IND_the_government_after_emergency:0 "Government After the Emergency"
 IND_the_government_after_emergency_desc:0 "Institutions built to survive one crisis now need rules for taxation, appointment, local authority, and succession in ordinary years."
 IND_mcnutts_second_mandate:0 "McNutt's Second Mandate"
 IND_mcnutts_second_mandate_desc:0 "McNutt will keep McHale at the party office while giving Willkie's recovery commission jurisdiction over utilities, credit, and industrial negotiation. Neither man will be allowed to mistake influence for shared sovereignty."
 IND_the_regency_in_law:0 "The Regency in Law"
 IND_the_regency_in_law_desc:0 "The council will publish its temporary powers, financial obligations, and succession procedure. A crown resting on emergency orders alone cannot survive its first peaceful year."
 IND_silver_county_governments:0 "Silver County Governments"
 IND_silver_county_governments_desc:0 "Pelley cannot administer every courthouse from the Statehouse. County commissioners will receive broad powers in return for reports, recruits, and strict political obedience."
 IND_the_congress_of_locals:0 "The Congress of Locals"
 IND_the_congress_of_locals_desc:0 "The committees that won the war will not dissolve into ministries without a vote. Mine locals, railroad brotherhoods, and municipal councils will receive permanent seats."

 # Purdue and the instrument district
 IND_the_van_de_graaff_tower:0 "The Van de Graaff Tower"
 IND_the_van_de_graaff_tower_desc:0 "Purdue's electrical engineers can house the high-voltage generator in a purpose-built tower beside the Physics Building. The appropriation also brings heavier lines into West Lafayette and teaches local firms how to insulate equipment no ordinary factory requires."
 IND_the_purdue_cyclotron:0 "The Purdue Cyclotron"
 IND_the_purdue_cyclotron_desc:0 "Hubert Yearian and John Howe have a magnet design, a shop estimate, and no supplier willing to explain the order to Washington. Indianapolis will buy the copper and steel in smaller lots and let Purdue assemble the machine on campus."
 IND_lark_horovitz_department:0 "Lark-Horovitz's Department"
 IND_lark_horovitz_department_desc:0 "Karl Lark-Horovitz has gathered physicists, glassblowers, machinists, and graduate assistants around problems that do not fit an ordinary university budget. Giving the department a permanent appropriation turns scattered expertise into a national laboratory in everything but name."
 IND_lafayette_instrument_shops:0 "The Lafayette Instrument Shops"
 IND_lafayette_instrument_shops_desc:0 "Vacuum pumps, precision glass, transformers, and measuring devices should not all travel from the coast. Purdue will issue drawings to shops in Lafayette and Indianapolis, creating suppliers able to serve both laboratories and war factories."
 IND_the_isotope_committee:0 "The Isotope Committee"
 IND_the_isotope_committee_desc:0 "The accelerator program now produces questions about targets, separation, shielding, and material accounting. A small committee will connect Purdue's physicists to the State Treasurer and the Special Services index before those questions leave Indiana."
 IND_purdue_electronics_bonus:0 "High-Voltage Engineering"
 IND_purdue_cyclotron_bonus:0 "Cyclotron Construction"
 IND_isotope_committee_bonus:0 "The Isotope Committee"

 # State works, firms, and railways
 IND_crossroads_of_america:0 "The Crossroads of America"
 IND_crossroads_of_america_desc:0 "The Pennsylvania crosses at Fort Wayne, the New York Central at Elkhart, and the Monon carries Chicago traffic through Indianapolis. Indiana will repair the junctions that make those names more than a slogan."
 IND_lines_from_boone_county:0 "Lines from Boone County"
 IND_lines_from_boone_county_desc:0 "In July 1935 the Boone County cooperative ran Indiana's first rural electric line to the Clark Woody farm. State guarantees can turn that experiment into a network of member-owned lines serving farms, workshops, and pumping stations."
 IND_the_monon_and_pennsylvania:0 "The Monon and Pennsylvania"
 IND_the_monon_and_pennsylvania_desc:0 "The two roads disagree about rates, crews, and federal certificates. They agree that broken track earns nothing. Indianapolis will standardize maintenance orders and reserve locomotives for state traffic."
 IND_ball_jars_and_lilly_vials:0 "Ball Jars and Lilly Vials"
 IND_ball_jars_and_lilly_vials_desc:0 "Muncie makes glass by the acre and Eli Lilly fills smaller vessels with things an army cannot improvise. Long contracts for standardized jars, ampoules, and medical packaging will reward precision without pretending every factory is an arsenal."
 IND_studebaker_retools:0 "Studebaker Retools"
 IND_studebaker_retools_desc:0 "South Bend survived receivership, the death of Albert Erskine, and two years in the courts. Paul Hoffman and Harold Vance will accept a truck contract if Indiana supplies steel, credit, and a buyer who cannot disappear in Washington."
 IND_allison_at_speedway:0 "Allison at Speedway"
 IND_allison_at_speedway_desc:0 "General Motors owns Allison Engineering; Indianapolis owns the roads, workforce, and machine shop that cannot be moved. The V-1710 program needs a production order large enough to carry it through the Army Air Corps acceptance tests."
 IND_evansville_keeps_the_river:0 "Evansville Keeps the River"
 IND_evansville_keeps_the_river_desc:0 "Evansville's wharves can replace part of the traffic lost at Chicago, but only if warehouses, cranes, and road approaches are treated as one terminal. Southern Indiana will receive the first river appropriation."
 IND_the_winter_quarters_at_peru:0 "The Winter Quarters at Peru"
 IND_the_winter_quarters_at_peru_desc:0 "Hagenbeck-Wallace no longer tours from Peru, but its Valley Farms winter quarters still hold railmen, animal handlers, riggers, carpenters, and men who can load a moving town before breakfast. The state has work for that knowledge."
 IND_state_purchasing_standards:0 "State Purchasing Standards"
 IND_state_purchasing_standards_desc:0 "Allison measures in tolerances, Studebaker in production runs, Lilly in sealed lots, and the departments in forms written by eight different offices. A State Purchasing Board will make contracts describe the same bolts, gauges, and delivery dates."
 IND_the_circus_trains:0 "The Circus Trains"
 IND_the_circus_trains_desc:0 "A circus train carried performers, animals, tents, kitchens, workshops, and its own power equipment through a different rail yard every night. Peru's old trainmasters will teach Guard quartermasters how that schedule was kept."
 IND_indiana_arsenal:0 "The Indiana Arsenal"
 IND_indiana_arsenal_desc:0 "Gary steel, South Bend trucks, Allison engines, Muncie glass, and Indianapolis purchasing standards can now be treated as one production system. The arsenal is not one building; it is the schedule joining them."
 IND_circus_city:0 "Circus City"
 IND_circus_city_desc:0 "Peru will reopen a public ring at the winter quarters and put the old wagons through town again. The show costs little beside a factory appropriation and gives the state one celebration not organized around an emergency order."
 IND_hoosier_manufacturing_bonus:0 "Standardized Hoosier Manufacturing"
 IND_studebaker_motorization_bonus:0 "The South Bend Truck Contract"
 IND_allison_aircraft_bonus:0 "The V-1710 Program"

 # The Guard and military schools
 IND_the_38th_cyclone:0 "The Cyclone Division"
 IND_the_38th_cyclone_desc:0 "The 38th Division supplied Indiana's only complete memory of staff work, mobilization tables, and large-unit drill. Its remaining officers will rebuild the division as a school for the entire Guard rather than a name carried by understrength regiments."
 IND_culver_military_academy:0 "Culver Military Academy"
 IND_culver_military_academy_desc:0 "Culver has taught infantry, artillery, cavalry, seamanship, and summer military courses on Lake Maxinkuckee for decades. The state will ask for instructors and classroom space, not turn cadets into a field regiment."
 IND_fort_benjamin_harrison:0 "Fort Benjamin Harrison"
 IND_fort_benjamin_harrison_desc:0 "The federal post northeast of Indianapolis was built for infantry and became a center for military administration and finance. Its records, classrooms, warehouses, and parade ground are more valuable intact than another confrontation over the flag above them."
 IND_divisional_maneuvers:0 "Divisional Maneuvers"
 IND_divisional_maneuvers_desc:0 "The Calumet fight taught platoons how to hold a road. It did not teach a division how to cross the state by rail, feed itself, replace casualties, and keep its headquarters in contact. The 38th will conduct that examination in the field."
 IND_the_black_horse_troop:0 "The Black Horse Troop"
 IND_the_black_horse_troop_desc:0 "Culver's mounted cadets have escorted governors and vice presidents and drilled before crowds since 1897. Their value to the Guard lies in horsemanship, stable management, discipline, and the habit of making complicated movement look effortless."
 IND_a_state_training_command:0 "A State Training Command"
 IND_a_state_training_command_desc:0 "Fort Harrison will coordinate recruit depots, schools, medical examinations, and reserve records. Field commanders may still train their regiments; they will no longer invent the administrative army behind them."
 IND_culver_staff_course:0 "The Culver Staff Course"
 IND_culver_staff_course_desc:0 "Guard majors, railroad dispatchers, Purdue engineers, and Culver instructors will spend a summer solving the same mobilization problems. Indiana needs officers who understand that an order without transport and supply is only handwriting."
 IND_atterbury_cantonment:0 "Atterbury Cantonment"
 IND_atterbury_cantonment_desc:0 "The farms south of Indianapolis offer rail access, water, and enough land for a camp that does not put every recruit at Fort Harrison. Surveyors will lay out roads, ranges, barracks, and a mobilization station years before Washington would have built them."
 IND_baer_field:0 "Baer Field"
 IND_baer_field_desc:0 "Fort Wayne's municipal airport has room for longer runways and lies beside the factories and railroads of northeast Indiana. A Guard flying field there will disperse aircraft away from Indianapolis and train ground crews close to industry."
 IND_jefferson_proving_ground:0 "Jefferson Proving Ground"
 IND_jefferson_proving_ground_desc:0 "The hills north of Madison can absorb artillery ranges, storage bunkers, and instrument stations without closing a county road for every firing table. Southern Indiana will become the place where new guns are proved rather than merely received."
 IND_an_army_of_our_own:0 "An Army of Our Own"
 IND_an_army_of_our_own_desc:0 "The 38th supplies tradition, Culver supplies instruction, Fort Harrison supplies administration, Atterbury supplies space, and the factories supply weapons. Indiana finally possesses an army designed for its own map and obligations."
 IND_baer_field_bonus:0 "Baer Field Flight Program"
 IND_jefferson_artillery_bonus:0 "Jefferson Firing Tables"

 # Intelligence and foreign service
 IND_the_state_police_index:0 "The State Police Index"
 IND_the_state_police_index_desc:0 "County sheriffs, railroad police, the Adjutant General, and the State Police all keep names in different formats. Special Services will copy only the entries tied to foreign procurement, sabotage, federal agents, and armed organizations."
 IND_railroad_listening_posts:0 "Railroad Listening Posts"
 IND_railroad_listening_posts_desc:0 "Dispatchers hear embargo orders before governors do. Trusted operators at Hammond, Evansville, Elkhart, and Terre Haute will pass unusual consists and sealed federal instructions to Indianapolis."
 IND_office_of_strategic_inquiry:0 "Office of Strategic Inquiry"
 IND_office_of_strategic_inquiry_desc:0 "The original section indexed paper. The new office will compare reports, prepare estimates, and send officers abroad under commercial cover. Its first rule is that collection without a question is only hoarding."
 IND_the_great_lakes_mission:0 "The Great Lakes Mission"
 IND_the_great_lakes_mission_desc:0 "Gary and South Bend reach the outside world through Chicago, Detroit, and Canadian ports whether Washington recognizes Indiana or not. A trade mission will begin with ore, machine tools, insurance, and shipping schedules."
 IND_the_meridian_street_question:0 "The Meridian Street Question"
 IND_the_meridian_street_question_desc:0 "The American Legion established its national headquarters in Indianapolis in 1919 and built on Meridian Street in 1925. It now occupies an independent capital while speaking for veterans of the United States. Both sides need written terms."
 IND_embassies_without_recognition:0 "Embassies Without Recognition"
 IND_embassies_without_recognition_desc:0 "Foreign ministries may refuse the word embassy and still accept Indiana's trade officers, military attachés, and encrypted bags. Indianapolis will furnish permanent missions and allow other governments to choose the sign on the door."
 IND_the_indiana_league:0 "The Indiana League"
 IND_the_indiana_league_desc:0 "Indiana cannot command a bloc through size. It can offer contracts, staff talks, and a guarantee that small governments will not be treated as temporary inconveniences. The first invitation will be practical before it is grand."
 IND_state_police_radio_bonus:0 "State Police Radio Work"

 # McNutt
 IND_the_appointments_book:0 "The Appointments Book"
 IND_the_appointments_book_desc:0 "McHale's county chairmen still know which prosecutor can deliver a courthouse and which department clerk can deliver a file. McNutt will record those obligations openly enough to distinguish administration from private debt."
 IND_willkies_recovery_commission:0 "Willkie's Recovery Commission"
 IND_willkies_recovery_commission_desc:0 "Willkie's lawyers and utility men will publish industrial surveys, credit terms, and freight losses under their own signatures. The commission remains McNutt's instrument, but it will not become another room in McHale's office."
 IND_department_heads_not_county_chairs:0 "Department Heads, Not County Chairs"
 IND_department_heads_not_county_chairs_desc:0 "The eight departments need directors who can survive a convention and an audit. County recommendations will remain evidence of political support; they will stop being the only qualification in the file."
 IND_the_public_utility_compact:0 "The Public Utility Compact"
 IND_the_public_utility_compact_desc:0 "Municipal systems, rural cooperatives, and private utilities will receive one rate procedure and one investment schedule. Willkie gets a workable compact; McNutt keeps final appointment power over the commission enforcing it."
 IND_the_price_of_cooperation:0 "The Price of Cooperation"
 IND_the_price_of_cooperation_desc:0 "McHale can accept rules that preserve the organization or watch Willkie's commission become the public face of government. McNutt has delayed the boundary long enough. He will decide which institution carries his second mandate."
 IND_machine_under_law:0 "The Machine Under Law"
 IND_machine_under_law_desc:0 "The party organization will remain, but assessments, appointments, and delegate credentials will follow published rules. McHale keeps a machine he can defend in daylight and loses the private exceptions that once made it effortless."
 IND_commission_government:0 "Commission Government"
 IND_commission_government_desc:0 "Industrial policy will pass through expert commissions chaired outside the county organization. McNutt remains Governor and McHale remains party chief; Willkie's method becomes the method of economic government."
 IND_the_indiana_model:0 "The Indiana Model"
 IND_the_indiana_model_desc:0 "McNutt can now point to departments that execute orders, a party that wins consent, and an industrial settlement Washington failed to break. The model is neither clean nor accidental. It is a government designed to function."
 IND_willkie_recovery_bonus:0 "Recovery Commission Surveys"
 IND_willkie_opening_bonus:0 "Willkie's Industrial Survey"

 # Harrison
 IND_the_benjamin_harrison_papers:0 "The Benjamin Harrison Papers"
 IND_the_benjamin_harrison_papers_desc:0 "The Harrison home on North Delaware preserves speeches, military correspondence, and the habits of an administration that once reached Washington from Indianapolis. The regency will use the papers as precedent, not scripture."
 IND_the_treasury_of_the_crown:0 "The Treasury of the Crown"
 IND_the_treasury_of_the_crown_desc:0 "Consortium advances, state warrants, and Columbia Club subscriptions cannot remain three private ledgers. A royal treasury will publish their order of claim and make the regency answer for every renewal it accepts."
 IND_the_assemblys_remonstrance:0 "The Assembly's Remonstrance"
 IND_the_assemblys_remonstrance_desc:0 "The General Assembly will retain the right to return a decree unsigned and force the council to publish its reasons. The power is narrow, but it turns legislative obedience into consent that must be renewed."
 IND_the_columbia_club_court:0 "The Columbia Club Court"
 IND_the_columbia_club_court_desc:0 "Subscribers, lawyers, genealogists, and petitioners already crowd the Columbia Club. The regency will formalize their advisory court while preventing its financial members from mistaking access for a second treasury."
 IND_the_empty_throne:0 "The Empty Throne"
 IND_the_empty_throne_desc:0 "The regency has a charter, a treasury, and a court; it still has no sovereign. The absence once protected every faction's preferred claimant. It now makes every permanent act look provisional."
 IND_the_crown_in_trust:0 "The Crown in Trust"
 IND_the_crown_in_trust_desc:0 "No claimant will be elevated until one can survive law, genealogy, and public scrutiny. The council will hold the Harrison crown in trust and govern through the charter it has already published."
 IND_a_harrison_convention:0 "A Harrison Convention"
 IND_a_harrison_convention_desc:0 "County delegations, Harrison descendants, military officers, and subscribers will meet under fixed rules to define the succession. The convention may not find a king; it will make the search a public institution."
 IND_the_first_royal_session:0 "The First Royal Session"
 IND_the_first_royal_session_desc:0 "The Assembly will open beneath the Harrison seal, receive the council's accounts, and test the remonstrance procedure on an ordinary appropriation. A monarchy proves itself when routine survives ceremony."

 # Pelley
 IND_read_the_remaining_boxes:0 "Read the Remaining Boxes"
 IND_read_the_remaining_boxes_desc:0 "The working county index was only a selection. The remaining Stephenson material contains dead men, false boasts, private crimes, and obligations that still reach public office. Pelley's readers will separate leverage from poison."
 IND_the_asheville_cadres:0 "The Asheville Cadres"
 IND_the_asheville_cadres_desc:0 "Silver Legion organizers from Pelley's North Carolina circle know lodge discipline and ideological instruction. Indiana's captured government needs clerks and county officers more than another uniformed procession."
 IND_county_commanders:0 "County Commanders"
 IND_county_commanders_desc:0 "Each commander will answer for recruitment, relief, public meetings, and reports from his courthouse. Indianapolis gains a named chain of responsibility; the counties gain men whose political careers depend on never reporting failure."
 IND_a_silver_civil_service:0 "A Silver Civil Service"
 IND_a_silver_civil_service_desc:0 "Pelley cannot dismiss every employee whose expertise predates the Legion. Examinations, loyalty declarations, and paired appointments will retain the machinery while placing a watcher beside every indispensable holdover."
 IND_the_old_files_price:0 "The Old Files' Price"
 IND_the_old_files_price_desc:0 "A government built through private obligations cannot claim renewal while preserving every instrument of the seizure. Burning the index would free enemies as well as servants. Keeping it would make blackmail a permanent department."
 IND_burn_the_index:0 "Burn the Index"
 IND_burn_the_index_desc:0 "The photographed cards and their working copies will be destroyed before witnesses. The Silver State will demand obedience through offices and doctrine, accepting that compromised men may rediscover their courage."
 IND_rule_by_file:0 "Rule by File"
 IND_rule_by_file_desc:0 "The index will receive archivists, cross-references, and a secure room inside Special Services. County commanders will understand that every private arrangement can become a state record."
 IND_the_silver_state_consolidated:0 "The Silver Administration"
 IND_the_silver_state_consolidated_desc:0 "The lodges recruit, the county commands report, and the departments issue orders under Pelley's seal. Whether ruled by doctrine or by file, the Silver State has outgrown the quiet conspiracy that opened its doors."

 # Wabash Commonwealth
 IND_wabash_reconstruction_board:0 "The Wabash Reconstruction Board"
 IND_wabash_reconstruction_board_desc:0 "Terre Haute's damaged halls, workshops, and municipal services cannot wait on constitutional debate. The board will put unemployed tradesmen on repairs and submit every requisition to the Congress of Locals."
 IND_brotherhood_rail_authority:0 "The Brotherhood Rail Authority"
 IND_brotherhood_rail_authority_desc:0 "Railroad brotherhoods supplied the movement's communications and carried its armed columns. Their dispatchers will now coordinate state traffic, locomotive reserves, and maintenance without surrendering the unions' control of crews."
 IND_mine_safety_committees:0 "Mine Safety Committees"
 IND_mine_safety_committees_desc:0 "Coal production cannot be rebuilt by asking miners to accept the roof falls and explosions of the old contracts. Elected safety committees will have authority to stop a dangerous shift and answer for the tonnage lost."
 IND_gary_shop_councils:0 "Gary Shop Councils"
 IND_gary_shop_councils_desc:0 "Gary's locals joined the Congress on terms written before the civil war. Shop councils will supervise hiring, grievances, and production schedules while the state retains authority over military orders and steel allocation."
 IND_a_constitution_of_locals:0 "A Constitution of Locals"
 IND_a_constitution_of_locals_desc:0 "The wartime Congress joined organizations that never agreed on how a peaceful state should command them. Delegates will define what Indianapolis may plan, what local bodies may refuse, and who controls armed formations between sessions."
 IND_the_state_plan:0 "The State Plan"
 IND_the_state_plan_desc:0 "Steel, coal, rail traffic, and machine production will enter one annual plan approved by the Congress. Locals retain representation and workplace authority; the state receives the power to set quantities and priority."
 IND_the_sovereign_locals:0 "The Sovereign Locals"
 IND_the_sovereign_locals_desc:0 "Mine, rail, shop, and municipal bodies will bargain their commitments through the Congress rather than receive compulsory quotas. The arrangement sacrifices speed to preserve the institutions that made the revolution possible."
 IND_the_hoosier_commonwealth:0 "The Hoosier Commonwealth"
 IND_the_hoosier_commonwealth_desc:0 "The relief kitchen, brotherhood lodge, mine local, and Gary shop council now belong to a constitutional order rather than a wartime coalition. Indiana's commonwealth will be judged by whether those bodies can govern without an occupation to resist."

 IND_mcnutt_campaign:0 "The State Convention"
 IND_mcnutt_campaign_desc:0 "Build enough support to keep the Indiana Democrats in power.\n\n§YPolitical Control:§! [?IND_political_control|0]/70\n\nOnly one operation may run at a time. New choices appear as the campaign develops; reach 70 to secure the final vote."
 IND_crown_campaign:0 "The Continuity Campaign"
 IND_crown_campaign_desc:0 "Build the financial, legislative, and military support for the Harrison regency.\n\n§YPolitical Control:§! [?IND_political_control|0]/70\n\nOnly one operation may run at a time."
 IND_silver_campaign:0 "The Silver Entry"
 IND_silver_campaign_desc:0 "Compromise the Machine and place Pelley's people inside the Statehouse before the proclamation.\n\n§YPolitical Control:§! [?IND_political_control|0]/70\n\nOnly one operation may run at a time."
 IND_wabash_campaign:0 "Preparing the Congress"
 IND_wabash_campaign_desc:0 "Organize the Wabash movement and prepare militia for the civil war.\n\n§YPolitical Control:§! [?IND_political_control|0]/70\n\nOnly one operation may run at a time. Armed preparations add units when the war begins."

 IND_dem_call_the_county_chairmen:0 "Call the County Chairmen"
 IND_dem_call_the_county_chairmen_desc:0 "McHale will demand a count before rumors and defections become facts.\n\n§YOn completion:§! §G+15 Political Control§! and §G+15 Political Power§!."
 IND_dem_call_the_county_chairmen_tt:0 "Gain §Y15 Political Control§! and §G15 Political Power§!."
 IND_dem_open_the_machine_books:0 "Open the Machine Books"
 IND_dem_open_the_machine_books_desc:0 "Publish the assessments and remove the officers the convention cannot defend.\n\n§YOn completion:§! §G+15 Political Control§! and §G+1% Stability§!."
 IND_dem_open_the_machine_books_tt:0 "Gain §Y15 Political Control§! and §G1% Stability§!."
 IND_dem_recruit_precinct_captains:0 "Recruit Precinct Captains"
 IND_dem_recruit_precinct_captains_desc:0 "Replace county promises with named captains responsible for turning out delegates.\n\n§YOn completion:§! §G+10 Political Control§! and §G+2% Democratic Support§!."
 IND_dem_recruit_precinct_captains_tt:0 "Gain §Y10 Political Control§! and §G2% Democratic Support§!."
 IND_dem_bring_willkie_to_the_table:0 "Bring Willkie to the Table"
 IND_dem_bring_willkie_to_the_table_desc:0 "Willkie will chair a public recovery commission covering utilities, credit, and the federal freight case. McHale keeps the party office.\n\n§YOn completion:§! §G+20 Political Control§! and §G+50 Political Power§!."
 IND_dem_bring_willkie_to_the_table_tt:0 "Gain §Y20 Political Control§! and §G50 Political Power§!."
 IND_dem_hold_the_state_convention:0 "Hold the State Convention"
 IND_dem_hold_the_state_convention_desc:0 "Force every faction to choose in one room and publish the result before Washington can dismiss it.\n\n§YOn completion:§! §G+25 Political Control§!, §G+2% Stability§!, and §G+3% Democratic Support§!."
 IND_dem_hold_the_state_convention_tt:0 "Gain §Y25 Political Control§!, §G2% Stability§!, and §G3% Democratic Support§!."

 IND_crown_renew_the_chicago_advance:0 "Renew the Chicago Advance"
 IND_crown_renew_the_chicago_advance_desc:0 "The consortium will extend Indiana's credit if its guarantors receive priority in the continuity settlement.\n\n§YOn completion:§! §G+15 Political Control§! and §G+1 off-map Civilian Factory§!; §R-2% Stability§!."
 IND_crown_renew_the_chicago_advance_tt:0 "Gain §Y15 Political Control§! and §G1 off-map Civilian Factory§!, but lose §R2% Stability§!."
 IND_crown_assemble_the_guarantors:0 "Assemble the Guarantors"
 IND_crown_assemble_the_guarantors_desc:0 "Put the creditors in one room and make each sign the same risk.\n\n§YOn completion:§! §G+15 Political Control§! and §G+25 Political Power§!."
 IND_crown_assemble_the_guarantors_tt:0 "Gain §Y15 Political Control§! and §G25 Political Power§!."
 IND_crown_subscribe_the_columbia_club:0 "Subscribe the Columbia Club"
 IND_crown_subscribe_the_columbia_club_desc:0 "Indianapolis notables will finance the petition if membership protects them from the men financing the state.\n\n§YOn completion:§! §G+10 Political Control§! and §G+1% Non-Aligned Support§!."
 IND_crown_subscribe_the_columbia_club_tt:0 "Gain §Y10 Political Control§! and §G1% Non-Aligned Support§!."
 IND_crown_circulate_the_harrison_petition:0 "Circulate the Harrison Petition"
 IND_crown_circulate_the_harrison_petition_desc:0 "A constitutional invention becomes respectable once enough recognizable names sign beneath it.\n\n§YOn completion:§! §G+20 Political Control§!, §G+3% Non-Aligned Support§!, and §G+1% Stability§!."
 IND_crown_circulate_the_harrison_petition_tt:0 "Gain §Y20 Political Control§!, §G3% Non-Aligned Support§!, and §G1% Stability§!."
 IND_crown_secure_guard_oaths:0 "Secure Guard Oaths"
 IND_crown_secure_guard_oaths_desc:0 "Officers will swear to the continuity government before they are asked to enforce it.\n\n§YOn completion:§! §G+25 Political Control§! and §G+15 Army Experience§!; §R-2% Stability§!."
 IND_crown_secure_guard_oaths_tt:0 "Gain §Y25 Political Control§! and §G15 Army Experience§!, but lose §R2% Stability§!."

 IND_pelley_photograph_the_county_index:0 "Photograph the County Index"
 IND_pelley_photograph_the_county_index_desc:0 "The old Stephenson files are incomplete. Pelley's men need copies before the remaining custodians sell them twice.\n\n§YOn completion:§! §G+15 Political Control§! and §G+2% Fascist Support§!; §R-1% Stability§!."
 IND_pelley_photograph_the_county_index_tt:0 "Gain §Y15 Political Control§! and §G2% Fascist Support§!, but lose §R1% Stability§!."
 IND_pelley_recruit_silver_lodges:0 "Recruit Silver Lodges"
 IND_pelley_recruit_silver_lodges_desc:0 "Small private lodges can test recruits without exposing the statewide organization.\n\n§YOn completion:§! §G+15 Political Control§! and §G+2% Fascist Support§!; §R-1% Stability§!."
 IND_pelley_recruit_silver_lodges_tt:0 "Gain §Y15 Political Control§! and §G2% Fascist Support§!, but lose §R1% Stability§!."
 IND_pelley_turn_a_machine_clerk:0 "Turn a Machine Clerk"
 IND_pelley_turn_a_machine_clerk_desc:0 "One payroll clerk can identify which county chairmen owe more than loyalty.\n\n§YOn completion:§! §G+10 Political Control§! and §G+35 Political Power§!."
 IND_pelley_turn_a_machine_clerk_tt:0 "Gain §Y10 Political Control§! and §G35 Political Power§!."
 IND_pelley_distribute_tailored_sermons:0 "Distribute Tailored Sermons"
 IND_pelley_distribute_tailored_sermons_desc:0 "Each county receives the version of Pelley's message most likely to pass as its own grievance.\n\n§YOn completion:§! §G+20 Political Control§! and §G+3% Fascist Support§!; §R-2% Stability§!."
 IND_pelley_distribute_tailored_sermons_tt:0 "Gain §Y20 Political Control§! and §G3% Fascist Support§!, but lose §R2% Stability§!."
 IND_pelley_replace_the_statehouse_watch:0 "Replace the Statehouse Watch"
 IND_pelley_replace_the_statehouse_watch_desc:0 "The night detail can seize an office by ensuring nobody loyal is present when it happens.\n\n§YOn completion:§! §G+25 Political Control§!, §G+2% Fascist Support§!, and §G+5 Army Experience§!; §R-3% Stability§!."
 IND_pelley_replace_the_statehouse_watch_tt:0 "Gain §Y25 Political Control§!, §G2% Fascist Support§!, and §G5 Army Experience§!, but lose §R3% Stability§!."

 IND_comm_reopen_the_relief_kitchens:0 "Reopen the Relief Kitchens"
 IND_comm_reopen_the_relief_kitchens_desc:0 "Food distribution restores the neighborhood lists the Terre Haute occupation tried to break.\n\n§YOn completion:§! §G+15 Political Control§!, §G+2% Communist Support§!, and §G+1% Stability§!."
 IND_comm_reopen_the_relief_kitchens_tt:0 "Gain §Y15 Political Control§!, §G2% Communist Support§!, and §G1% Stability§!."
 IND_comm_print_the_strike_bulletin:0 "Print the Strike Bulletin"
 IND_comm_print_the_strike_bulletin_desc:0 "A regular sheet gives each committee the same schedule, demands, and signal.\n\n§YOn completion:§! §G+10 Political Control§!, §G+2% Communist Support§!, and §G1 militia division§! when war begins."
 IND_comm_print_the_strike_bulletin_tt:0 "Gain §Y10 Political Control§!, §G2% Communist Support§!, and prepare §G1 militia division§!."
 IND_comm_organize_railroad_cells:0 "Organize Railroad Cells"
 IND_comm_organize_railroad_cells_desc:0 "Railroad brotherhoods can move men and messages after the Guard closes the highways.\n\n§YOn completion:§! §G+15 Political Control§!, §G+10 Army Experience§!, and §G1 militia division§! when war begins."
 IND_comm_organize_railroad_cells_tt:0 "Gain §Y15 Political Control§!, §G10 Army Experience§!, and prepare §G1 militia division§!."
 IND_comm_arm_the_mine_road_caches:0 "Arm the Mine-Road Caches"
 IND_comm_arm_the_mine_road_caches_desc:0 "Rifles will be divided between barns and union halls along routes the Guard cannot seal at once.\n\n§YOn completion:§! §G+20 Political Control§!, §G+600 Infantry Equipment§!, §G+2% War Support§!, and §G2 militia divisions§! when war begins."
 IND_comm_arm_the_mine_road_caches_tt:0 "Gain §Y20 Political Control§!, §G600 Infantry Equipment§!, and §G2% War Support§!; prepare §G2 militia divisions§!."
 IND_comm_raise_the_calumet_militia:0 "Raise the Calumet Militia"
 IND_comm_raise_the_calumet_militia_desc:0 "Gary's steelworkers will form their own columns under officers chosen by the locals.\n\n§YOn completion:§! §G+25 Political Control§!, §G+400 Infantry Equipment§!, §G+3% Communist Support§!, §G+3% War Support§!, and §G2 militia divisions§! when war begins."
 IND_comm_raise_the_calumet_militia_tt:0 "Gain §Y25 Political Control§!, §G400 Infantry Equipment§!, §G3% Communist Support§!, and §G3% War Support§!; prepare §G2 militia divisions§!."

 IND_intro.1.t:0 "Indiana, January 1936"
 IND_intro.1.d:0 "Indiana begins the year as a government under pressure rather than a settled country.\n\nMcNutt's centralized administration still operates, but his term is ending. The Guard remains in Terre Haute under a disputed federal order. Washington is choking freight and credit through paperwork, while a Chicago consortium quietly keeps the state payroll current.\n\nBy winter's end, one claimant must control Indianapolis."
 IND_intro.1.a:0 "Who can take it?"
 IND_intro.1.b:0 "Begin."
 IND_intro.2.t:0 "Four Claims on the Statehouse"
 IND_intro.2.d:0 "McNutt proposes a state convention and a recovery commission chaired by Wendell Willkie. The men renewing Indiana's Chicago notes offer a Harrison regency instead. Pelley's agents are testing old political obligations, while Hapgood's committees reopen kitchens in Terre Haute.\n\nAll four claims depend on organizations that already exist. Only one can inherit the departments."
 IND_intro.2.a:0 "The Statehouse cannot serve all four."

 IND_opening.2.t:0 "The Statehouse Question"
 IND_opening.2.d:0 "McNutt has ordered McHale to prepare a state convention. At the Columbia Club, subscribers to Indiana's emergency credit circulate a Continuity Act bearing the Harrison name. Silver Legion recruiters have begun calling on county officers. In Terre Haute, relief committees meet again under Powers Hapgood.\n\nEach group now possesses money, names, or disciplined men. None will accept a settlement written by the others."
 IND_opening.2.a:0 "One claim will reach the Governor's Office."

 IND_democratic.1.t:0 "The Machine Stays"
 IND_democratic.1.d:0 "McNutt orders a state convention before the end of his term. McHale will count delegates and defend the party organization; a separate recovery commission will answer criticism that every public question ends in the same political office."
 IND_democratic.1.a:0 "Count the organization."
 IND_democratic.2.t:0 "The Ledgers Open"
 IND_democratic.2.d:0 "The published statement confirms salary assessments and names the county officers responsible for collecting them. McHale removes two collectors whose accounts do not balance and keeps the rest of the organization intact."
 IND_democratic.2.a:0 "Make it answer for itself."
 IND_democratic.3.t:0 "Willkie at the Claypool"
 IND_democratic.3.d:0 "Willkie arrives at the Claypool with counsel from Commonwealth & Southern and a draft charter for the Indiana Recovery Commission. It covers utility regulation, emergency credit, and the federal freight case. It gives McHale no appointment power.\n\nMcNutt accepts the draft. Willkie will defend Indiana's economic position without defending the Two Percent Club."
 IND_democratic.3.a:0 "Sign the commission charter."
 IND_democratic.4.t:0 "The Convention Called"
 IND_democratic.4.d:0 "County delegations have been certified. McNutt will defend the reorganization of state government; McHale will answer for the assessments; Willkie will present the recovery commission and the case against federal freight enforcement."
 IND_democratic.4.a:0 "Put it to a vote."
 IND_democratic.20.t:0 "McNutt Holds the Statehouse"
 IND_democratic.20.d:0 "The convention returns a clear majority for McNutt. It adopts the Recovery Commission charter and requires published party assessments before the next convention. McHale keeps control of organization and appointments; Willkie leaves with authority over the economic case and none over the party."
 IND_democratic.20.a:0 "Now govern."
 IND_democratic_20_a_tt:0 "Paul V. McNutt remains Governor. Adds §YThe McNutt Administration§!."

 IND_1816.1.t:0 "The Harrison Offer"
 IND_1816.1.d:0 "The men behind Indiana's emergency credit propose a continuity government bearing the Harrison name. They have money, lawyers, and a draft act. They do not yet have a public petition or the Guard."
 IND_1816.1.a:0 "Make them commit."
 IND_1816.2.t:0 "The Guarantors"
 IND_1816.2.d:0 "The consortium's principals sign the same undertaking in a locked Columbia Club room. No man can now expose the scheme without exposing his own account."
 IND_1816.2.a:0 "One ledger, one risk."
 IND_1816.3.t:0 "A Name Before a Person"
 IND_1816.3.d:0 "The petition does not name a king. It asks the Assembly to recognize the Harrison line as guarantor of Indiana's constitutional continuity until a convention determines the succession."
 IND_1816.3.a:0 "Circulate it."
 IND_1816.4.t:0 "The Guard's Signature"
 IND_1816.4.d:0 "Selected officers accept commissions from the proposed council. Their oath refers to Indiana, continuity, and lawful civil authority. It does not refer to McNutt."
 IND_1816.4.a:0 "Seal the Statehouse."
 IND_1816.20.t:0 "The Regency Proclaimed"
 IND_1816.20.d:0 "The Assembly reads the Continuity Act while Guard detachments close the Statehouse entrances. McNutt leaves through the executive garage. The council assumes the departments in the Harrison name and promises a convention at an unspecified date."
 IND_1816.20.a:0 "Long live Indiana."
 IND_1816_20_a_tt:0 "The §YHarrison Regency Council§! assumes the executive departments. Adds §YThe Harrison Regency§!."

 IND_black_boxes.1.t:0 "The Silver Entry"
 IND_black_boxes.1.d:0 "Pelley's first package contains no manifesto. It contains copied index cards from the old Stephenson organization and instructions to verify which obligations still bind living men."
 IND_black_boxes.1.a:0 "Start with the names."
 IND_black_boxes.2.t:0 "The County Index"
 IND_black_boxes.2.d:0 "Some entries are useless, some are false, and several are recent enough to ruin careers. A payroll clerk agrees to mark the county chairmen who still answer their own telephones."
 IND_black_boxes.2.a:0 "Make a working copy."
 IND_black_boxes.3.t:0 "Different Sermons"
 IND_black_boxes.3.d:0 "Indianapolis receives Pelley's language of order. Rural lodges receive renewal. Businessmen receive private warnings about the Wabash committees. The contradictions never appear on the same page."
 IND_black_boxes.3.a:0 "Give each man what he fears."
 IND_black_boxes.4.t:0 "The Night Detail"
 IND_black_boxes.4.d:0 "New guards begin taking the late shifts in pairs. They learn the records room, the switchboard, and the executive entrance before anyone asks who recommended them."
 IND_black_boxes.4.a:0 "Leave the doors open."
 IND_black_boxes.20.t:0 "Pelley on the Steps"
 IND_black_boxes.20.d:0 "Before dawn, the night detail locks out the regular watch and places copied files on the desks of the men expected to object. County chairmen telephone their support by eight. Pelley addresses a controlled crowd at noon while State Police secure the department buildings."
 IND_black_boxes.20.a:0 "Announce the Silver State."
 IND_black_boxes_20_a_tt:0 "§YWilliam Dudley Pelley§! becomes leader. Adds §YThe Silver Administration§!."

 IND_terre_haute.1.t:0 "The Wabash Answer"
 IND_terre_haute.1.d:0 "Hapgood accepts that Indianapolis will not lift the occupation because a petition asks politely. The relief committees must become a political network, then an armed one."
 IND_terre_haute.1.a:0 "Begin with food and addresses."
 IND_terre_haute.2.t:0 "North Eighth Street"
 IND_terre_haute.2.d:0 "The kitchen on North Eighth reopens under three names and one schedule. Families receive food; organizers recover the block lists lost during the Guard searches."
 IND_terre_haute.2.a:0 "Rebuild from the kitchen."
 IND_terre_haute.3.t:0 "The Mine Roads"
 IND_terre_haute.3.d:0 "Drivers from Brazil and Clinton map barns, union halls, and roads that remain passable after rain. Rifles can be divided among them faster than the Guard can search them."
 IND_terre_haute.3.a:0 "Prepare the caches."
 IND_terre_haute.4.t:0 "The Calumet Delegates"
 IND_terre_haute.4.d:0 "Gary's delegates refuse a symbolic vote. If Calumet joins the Congress, its locals will raise their own armed columns and retain their own officers."
 IND_terre_haute.4.a:0 "Put the terms in writing."
 IND_terre_haute.20.t:0 "The Wabash Congress"
 IND_terre_haute.20.d:0 "Delegates meeting under guard in Terre Haute declare a provisional government and order the occupation dissolved. Indianapolis rejects the Congress and rallies democratic officials around the capital.\n\nThe opposition controls Indianapolis and a broad share of the state. Wabash columns now move from the counties where they were prepared."
 IND_terre_haute.20.a:0 "Indiana will be decided in the field."
 IND_terre_haute_20_a_tt:0 "The democratic command receives §YIndianapolis§! and approximately §Y55% of Indiana§!. The Wabash army receives two base militia divisions plus every prepared formation."

 IND_1937.1.t:0 "The Files on the Desk"
 IND_1937.1.d_democratic:0 "The convention adjourns, but three folders remain on McNutt's desk. Departmental commissions still cite the disputed 1933 reorganization. Vigo County remains under an emergency order. The Chicago payroll note matures in ninety days."
 IND_1937.1.d_crown:0 "The council receives the Statehouse keys and three unresolved files. Departmental commissions bear McNutt's authority, Vigo County remains under military order, and the Chicago lenders who financed continuity expect a renewal."
 IND_1937.1.d_pelley:0 "Pelley's men control the entrances, not the legal instruments inside. Department heads request new commissions, the Vigo occupation continues, and the Chicago note falls due before the Silver administration has a budget."
 IND_1937.1.d_communist:0 "The wartime committees inherit departments still commissioned under McNutt, a military occupation in the city where the revolt began, and short-term notes held by banks untouched by the civil war."
 IND_1937.1.a:0 "Set the folders in order."
 IND_1937.2.t:0 "The Department Inventory"
 IND_1937.2.d:0 "The audit identifies 169 former agencies compressed into eight departments. Most employees can remain at their desks. Directors, purchasing officers, and payroll clerks require new commissions before they can sign obligations beyond the current quarter."
 IND_1937.2.a:0 "Prepare the new commissions."
 IND_1937.3.t:0 "The New Seal"
 IND_1937.3.d:0 "Department directors surrender their old commissions and receive new ones in the Statehouse rotunda. Payroll warrants issued that afternoon cite the current government for the first time."
 IND_1937.3.a:0 "Issue the warrants."
 IND_1937.4.t:0 "The Terre Haute Commission"
 IND_1937.4.d:0 "Judges and city officers enter the courthouse with Guard quartermasters and representatives of Local 19694. They begin with prisoners, confiscated weapons, damaged buildings, and the telephone exchange."
 IND_1937.4.d_communist:0 "Municipal delegates enter the courthouse with Guard quartermasters and representatives of Local 19694. They begin with prisoners, confiscated weapons, damaged buildings, and the telephone exchange."
 IND_1937.4.a:0 "Write down every claim."
 IND_1937.5.t:0 "The Last Guard Inventory"
 IND_1937.5.d:0 "Civil officers sign for the courthouse, armory, and telephone exchange. The final Guard patrol leaves Terre Haute after dusk under a schedule agreed with the unions and city government."
 IND_1937.5.d_communist:0 "The last Guard quartermaster signs the courthouse and armory over to the municipal committee. Militia remain under ordinary state orders rather than the old martial-law proclamation."
 IND_1937.5.a:0 "Withdraw the emergency order."
 IND_1937.6.t:0 "Current Authority"
 IND_1937.6.d:0 "Indiana's departments now spend under current commissions. Civil officers hold the Terre Haute courthouse. The Treasury knows who owns its emergency notes and on what terms they will be carried."
 IND_1937.6.a:0 "Take up the freight orders."
 IND_1937.7.t:0 "The Hammond Board"
 IND_1937.7.d:0 "Indiana consolidates delayed freight papers at a new inspection board in Hammond. Cargo with valid state certificates proceeds east; contested shipments remain in the yards. Federal offices answer by stationing marshals and an Army emergency column across the Illinois line."
 IND_1937.7.a:0 "Keep the board open."

 IND_hidden.1.t:0 "The Maturity Date"
 IND_hidden.1.d:0 "The Treasurer's note records a Chicago holding company, a ninety-day renewal, and a block of Indiana warehouse receipts as security. Clearing records show that the payroll money arrived in five transfers from three different banks."
 IND_hidden.1.a:0 "Trace all five transfers."
 IND_hidden.2.t:0 "The Utility Accounts"
 IND_hidden.2.d:0 "Two transfers passed through utility subsidiaries whose Public Service Commission filings name the same Indianapolis counsel. His office retained a second schedule matching each lender to the state warrants pledged against its advance."
 IND_hidden.2.a:0 "Obtain the schedule."
 IND_hidden.3.t:0 "The Chicago Schedule"
 IND_hidden.3.d_democratic:0 "The schedule names the banks, utilities, and Indianapolis counsel behind Consortium Credit. McNutt can publish the ownership and require future state borrowing to pass through open bids."
 IND_hidden.3.d_crown:0 "The schedule confirms that the same subscribers financing the regency hold most of Indiana's emergency notes. A public charter can fix their rights and prevent another private renewal."
 IND_hidden.3.d_pelley:0 "Several signatories also appear in Pelley's copied county index. The Silver administration can seize the notes, dismiss the intermediaries, and keep the clearing network."
 IND_hidden.3.d_communist:0 "The schedule maps the banks and utility accounts through which private lenders financed the payroll. The Wabash government can transfer the notes and staff into a public credit board."
 IND_hidden.3.a:0 "Publish the ownership and require open bids."
 IND_hidden.3.b:0 "Charter the subscribers."
 IND_hidden.3.c:0 "Seize the notes and clearing files."
 IND_hidden.3.d:0 "Establish the Indiana Credit Board."

 IND_federal.1.t:0 "The Train at Hammond"
 IND_federal.1.d:0 "At 6:10 in the morning, Indiana inspectors halt a federally disputed freight train west of Hammond. The conductor produces a federal release; the state board refuses it and seals the papers for review. Marshals approach first. Army trucks stop behind them on the Illinois road. The inspector in charge reads the Indianapolis order aloud and keeps the barrier down."
 IND_federal.1.a:0 "Hold the inspection line."
 IND_federal.2.t:0 "The Federal Column Withdraws"
 IND_federal.2.d:0 "The federal emergency brigades fail to break the Calumet line. Their last organized column withdraws into Illinois under covering fire while Indiana engineers reopen the local roads behind it. Hammond remains in state hands, the disputed freight remains under state seal, and Washington must explain how an enforcement action became a defeat."
 IND_federal.2.a:0 "The line held."
 IND_federal.3.t:0 "The Inspection Posts Are Taken"
 IND_federal.3.d:0 "Federal infantry clears the last Indiana position outside Hammond and takes custody of the inspection offices. The freight board is dissolved under guard. Washington stops short of occupation, but a supervision commission will now examine Indiana's rail orders, emergency borrowing, and Guard deployments."
 IND_federal.3.a:0 "End the fighting."
 IND_federal.6.t:0 "On Level Ground"
 IND_federal.6.d_victory:0 "The departments now carry current commissions, Terre Haute is under civil government, and the Chicago notes have been answered. At Hammond, Indiana compelled Washington to abandon an enforcement campaign it expected to finish in days. The emergency is over. What follows will be policy rather than triage."
 IND_federal.6.d_defeat:0 "The departments now carry current commissions, Terre Haute is under civil government, and the Chicago notes have been answered. The Hammond fighting ended under federal supervision, but Indianapolis remains a functioning government with room to rebuild. The emergency is over. What follows will be policy rather than triage."
 IND_federal.6.d_compromise:0 "The departments now carry current commissions, Terre Haute is under civil government, and the Chicago notes have been answered. The Hammond confrontation ended without a decision, leaving a narrow federal commission and no occupying army. The emergency is over. What follows will be policy rather than triage."
 IND_federal.6.a:0 "Begin the next appropriation."
 IND_federal.8.t:0 "A Line Without a Battle"
 IND_federal.8.d:0 "Orders and counterorders reach the Illinois road before either side commits its reserve. The disputed train returns to the yard, federal troops leave the approaches, and negotiators establish a temporary supervision commission. Neither government can claim victory; both avoid a funeral list."
 IND_federal.8.a:0 "Accept the narrow commission."

 IND_government.1.t:0 "McNutt's Second Cabinet"
 IND_government.1.d:0 "McNutt appoints department heads for a government no longer organized around immediate survival. McHale retains the party office and the county organization. Willkie's commission receives utilities, industrial credit, and the public case against federal discrimination. The division is deliberate: the Machine may win elections, but it will not write every economic order."
 IND_government.1.a:0 "Put the distinction in writing."
 IND_government.2.t:0 "The Regency Charter"
 IND_government.2.d:0 "The council publishes the rules it once kept inside committee minutes. The charter fixes the regent's powers, the succession convention, the Assembly's right of remonstrance, and the obligations carried from the 1816 Society. A government assembled in emergency now possesses a law it must obey."
 IND_government.2.a:0 "Affix the state seal."
 IND_government.3.t:0 "Silver Counties"
 IND_government.3.d:0 "Pelley's administration divides Indiana into county commands responsible for recruiting, political reports, relief distribution, and public ceremonies. Commissioners gain quick access to Indianapolis and direct control over local appointments. In return, every failure acquires a named author."
 IND_government.3.a:0 "Issue the county commissions."
 IND_government.4.t:0 "The Congress of Locals"
 IND_government.4.d:0 "Mine locals, railroad brotherhoods, relief committees, and municipal councils send delegates to a permanent state congress. The arrangement preserves the organizations that won the civil war while giving the departments one body capable of approving budgets and statewide orders."
 IND_government.4.a:0 "Call the first session."

 IND_purdue.1.t:0 "A Question from West Lafayette"
 IND_purdue.1.d:0 "Karl Lark-Horovitz reports that federal purchasing officers are acquiring high-voltage equipment, vacuum components, and precision instruments through unusual channels. Purdue's instrument shops can identify the pattern, but only if Indianapolis accepts that the inquiry itself may attract attention."
 IND_purdue.1.a:0 "Ask what the instruments have in common."
 IND_purdue.2.t:0 "The West Lafayette Memorandum"
 IND_purdue.2.d:0 "Purdue's physicists believe the purchasing pattern concerns particle acceleration and nuclear research. They offer two arrangements: a protected state program with closed procurement, or university ownership with published accounts and limited outside inspection. Only the first gives Indianapolis sole custody of the work."
 IND_purdue.2.a:0 "Create the secret state program."
 IND_purdue.2.b:0 "Keep it at Purdue under inspection."
 IND_purdue_2_a_tt:0 "Establishes the §YPurdue State Program§!, costs §R75 Political Power§!, and grants one §G50% Nuclear Research Bonus§!."
 IND_purdue_2_b_tt:0 "Establishes the §YWest Lafayette Understanding§!, costs §R25 Political Power§!, adds §G2% Stability§!, and grants one §G25% Nuclear Research Bonus§!."
 IND_purdue_accelerator_bonus:0 "Purdue Accelerator Program"

 # Opened-state national spirits
 IND_state_works_program:0 "The State Works Schedule"
 IND_state_works_program_desc:0 "Road, drainage, school, utility, and municipal contracts now pass through one appropriation calendar. The schedule builds quickly, though the State Treasurer must reserve more civilian production for public orders."
 IND_purdue_instrument_network:0 "Purdue Instrument Network"
 IND_purdue_instrument_network_desc:0 "Lafayette and Indianapolis shops supply vacuum equipment, high-voltage components, glassware, and measuring instruments to a permanent university research program."
 IND_boone_county_electrification:0 "Boone County Electrification"
 IND_boone_county_electrification_desc:0 "Member-owned rural lines spread outward from the cooperative work begun near Lebanon in 1935, bringing power to farms and small workshops beyond the private utilities' preferred routes."
 IND_state_purchasing_board:0 "The State Purchasing Board"
 IND_state_purchasing_board_desc:0 "Common specifications for gauges, fasteners, packaging, and delivery allow Indiana factories to change contracts without discarding as much accumulated experience."
 IND_circus_rail_men:0 "Circus Rail Men"
 IND_circus_rail_men_desc:0 "Trainmasters and riggers from Peru's old winter quarters have brought the schedules of a traveling city into Guard logistics and state railway construction."
 IND_integrated_war_industry:0 "The Indiana Arsenal"
 IND_integrated_war_industry_desc:0 "Gary steel, Studebaker vehicles, Allison engines, Muncie glass, and Indianapolis purchasing orders now operate as parts of one armaments system."
 IND_38th_cyclone_tradition:0 "The Cyclone Tradition"
 IND_38th_cyclone_tradition_desc:0 "The reorganized 38th Division supplies mobilization tables, instructors, and a common divisional identity to formations once connected only by the State Adjutant's paperwork."
 IND_state_training_command:0 "State Training Command"
 IND_state_training_command_desc:0 "Fort Harrison coordinates recruit depots, examinations, records, and schools, shortening the path between civilian registration and a trained replacement."
 IND_culver_officer_corps:0 "The Culver Staff Course"
 IND_culver_officer_corps_desc:0 "Culver instructors, Guard officers, engineers, and railroad dispatchers now share one staff curriculum built around Indiana's terrain and mobilization problems."
 IND_army_of_our_own:0 "An Army of Our Own"
 IND_army_of_our_own_desc:0 "Indiana's army has its own camps, schools, proving grounds, airfield, mobilization tables, and industrial contracts. It no longer exists as a federal table with the letterhead changed."
 IND_railroad_listening_network:0 "Railroad Listening Network"
 IND_railroad_listening_network_desc:0 "Trusted dispatchers and railroad police report unusual federal orders, sealed cars, and interrupted traffic from the state's principal junctions."
 IND_strategic_inquiry:0 "Office of Strategic Inquiry"
 IND_strategic_inquiry_desc:0 "A permanent analytical office turns State Police files, railway reports, commercial correspondence, and foreign collection into estimates for the cabinet and General Staff."
 IND_great_lakes_trade:0 "Great Lakes Trade"
 IND_great_lakes_trade_desc:0 "Standing arrangements through Chicago, Detroit, and Canadian ports give Indiana access to ore, machine tools, insurance, and buyers outside the federal freight system."
 IND_unrecognized_embassies:0 "Embassies Without Recognition"
 IND_unrecognized_embassies_desc:0 "Indiana's permanent missions conduct trade talks, military observation, and encrypted correspondence even where the host government insists on calling them commercial offices."
 IND_legion_indiana_compact:0 "The Indiana-Legion Compact"
 IND_legion_indiana_compact_desc:0 "The American Legion headquarters may speak nationally, but its Indianapolis staff and facilities will support Indiana mobilization under a written compact."
 IND_legion_neutral_headquarters:0 "Neutral National Headquarters"
 IND_legion_neutral_headquarters_desc:0 "Indiana guarantees the Legion's national status, archives, and communications in return for strict neutrality in disputes between Indianapolis and Washington."
 IND_machine_under_law_idea:0 "The Machine Under Law"
 IND_machine_under_law_idea_desc:0 "McHale's organization retains its county captains and electoral discipline under published rules for assessments, credentials, and appointments."
 IND_commission_government_idea:0 "Commission Government"
 IND_commission_government_idea_desc:0 "Willkie's surveyors, utility lawyers, and industrial specialists now carry Indiana's economic policy through commissions formally separated from the party office."
 IND_columbia_club_court:0 "The Columbia Club Court"
 IND_columbia_club_court_desc:0 "The regency's subscribers and legal advisers have a formal place to present claims, channeling elite influence through a body whose proceedings can be recorded."
 IND_crown_in_trust_idea:0 "The Crown in Trust"
 IND_crown_in_trust_idea_desc:0 "The Regency Council holds the Harrison crown as a legal trust until a claimant can survive constitutional and genealogical examination."
 IND_harrison_convention_idea:0 "The Harrison Convention"
 IND_harrison_convention_idea_desc:0 "A standing convention of county delegates, Harrison descendants, officers, and subscribers gives the unsettled succession a public procedure."
 IND_silver_county_commanders:0 "Silver County Commanders"
 IND_silver_county_commanders_desc:0 "Named commissioners answer directly to Indianapolis for recruits, public meetings, relief distribution, and political reporting in every county."
 IND_burned_index_idea:0 "The Index Burned"
 IND_burned_index_idea_desc:0 "Pelley's government destroyed the copied obligations used in its seizure and must now command through doctrine and offices rather than permanent private coercion."
 IND_rule_by_file_idea:0 "Rule by File"
 IND_rule_by_file_idea_desc:0 "The county index has become a secure state archive, cross-referenced with police reports and appointments to make private vulnerability an ordinary instrument of government."
 IND_mine_safety_committees_idea:0 "Mine Safety Committees"
 IND_mine_safety_committees_idea_desc:0 "Elected underground committees may stop dangerous work, trading some managerial freedom for fewer disasters and stronger confidence in commonwealth industry."
 IND_state_plan_idea:0 "The State Plan"
 IND_state_plan_idea_desc:0 "The Congress sets annual quantities and priorities for coal, steel, transport, and machine production, concentrating resources at the cost of political flexibility and civilian supply."
 IND_sovereign_locals_idea:0 "Sovereign Locals"
 IND_sovereign_locals_idea_desc:0 "Workplace and municipal bodies bargain their commitments through the Congress, preserving local initiative and consent at the expense of centralized direction."

 # Expansion events
 IND_expansion.1.t:0 "The Magnet Takes Current"
 IND_expansion.1.d:0 "In a cleared Purdue workshop, Hubert Yearian checks the cooling lines while John Howe watches the ammeter climb. The cyclotron magnet has been assembled from separately invoiced steel, copper, and machine work; no supplier saw the whole drawing. When the switch closes, the floor hums and the needle holds. The machine is still months from useful experimental work, but West Lafayette has crossed from proposal into apparatus."
 IND_expansion.1.a:0 "Record the first successful test."
 IND_expansion.2.t:0 "The South Bend Contract"
 IND_expansion.2.d:0 "Paul Hoffman receives the state truck schedule in Studebaker's administration building. It avoids promises of impossible volume and guarantees steel deliveries from Gary. The company escaped receivership by making every expenditure answer for itself; its engineers now return with a chassis that shares parts across cargo, ambulance, and artillery-tractor variants."
 IND_expansion.2.a:0 "Authorize the common chassis."
 IND_expansion.3.t:0 "V-1710"
 IND_expansion.3.d:0 "At Allison's Speedway shop, engineers run the liquid-cooled V-1710 against a state acceptance schedule drafted before the Army Air Corps completes its own. The engine is powerful, temperamental, and too important to leave as a sequence of prototypes. Indiana's order keeps the line alive while the test crews work through cooling, supercharging, and production tolerances."
 IND_expansion.3.a:0 "Pay for the next test series."
 IND_expansion.4.t:0 "Valley Farms"
 IND_expansion.4.d:0 "The old Hagenbeck-Wallace winter quarters outside Peru are quieter than they were when a hundred-city season left from these tracks. The men who remain can still point to the loading order: power wagons, kitchens, stock cars, tents, performers, and the equipment needed first at the next ground. Guard quartermasters arrive expecting novelty and leave with notebooks full of timings."
 IND_expansion.4.a:0 "Hire the trainmasters."
 IND_expansion.5.t:0 "One Production Schedule"
 IND_expansion.5.d:0 "The State Purchasing Board posts a wall chart joining Gary heat numbers, Studebaker chassis deliveries, Allison engine lots, and ammunition orders from Indianapolis. No factory has surrendered its management. Each has surrendered the right to claim it did not know what the others required."
 IND_expansion.5.a:0 "Issue the arsenal schedule."
 IND_expansion.6.t:0 "The Culver Invitation"
 IND_expansion.6.d:0 "Culver's commandant agrees to host Guard officers after the summer cadets leave Lake Maxinkuckee. The Academy will provide classrooms, map exercises, artillery instructors, and access to its riding hall. It refuses a request to commission schoolboys automatically; Indianapolis accepts the distinction."
 IND_expansion.6.a:0 "Send officers, not recruiters."
 IND_expansion.7.t:0 "The Black Horses"
 IND_expansion.7.d:0 "The Black Horse Troop enters the Culver riding hall in files precise enough to look mechanical. Guard observers are less interested in ceremony than in the stable books, remount inspections, equipment lists, and the movement of animals and men on a fixed clock. By the afternoon, the first motor-transport instructor has begun translating the same sequence into trucks."
 IND_expansion.7.a:0 "Keep the discipline; change the mount."
 IND_expansion.8.t:0 "The Atterbury Survey"
 IND_expansion.8.d:0 "Railroad engineers and county surveyors mark fields south of Indianapolis for barracks, ranges, hospitals, warehouses, and a mobilization station. Owners receive schedules showing which parcels the state needs permanently and which it will lease for maneuvers. The camp begins as stakes, roads, and a siding before it acquires a gate."
 IND_expansion.8.a:0 "Build the cantonment in stages."
 IND_expansion.9.t:0 "The First Estimate"
 IND_expansion.9.d:0 "Special Services delivers its first bound estimate to the cabinet. Railroad reports establish movements; commercial cables identify purchases; State Police files supply names; foreign newspapers reveal what Indiana's sources missed. The conclusion includes confidence levels and dissenting notes. For the first time, Indianapolis receives an argument rather than a folder."
 IND_expansion.9.a:0 "Circulate it to the cabinet and staff."
 IND_expansion.10.t:0 "777 North Meridian"
 IND_expansion.10.d:0 "The American Legion's national headquarters stands within walking distance of the Statehouse and represents veterans far beyond Indiana. Its officers will not renounce the United States; neither will they let federal agents treat their Indianapolis building as an extraterritorial post. McNutt's history with the Legion opens one agreement. Strict institutional neutrality opens another."
 IND_expansion.10.a:0 "Write an Indiana mobilization compact."
 IND_expansion.10.b:0 "Guarantee a neutral national headquarters."
 IND_expansion.11.t:0 "McNutt Draws the Line"
 IND_expansion.11.d:0 "McNutt meets McHale and Willkie with two completed reports on the table: appointments in one, utilities and credit in the other. The division that worked during recovery cannot remain an informal favor. McHale wants a party organization strong enough to govern; Willkie wants commissions strong enough to resist it. McNutt intends to remain above whichever answer he chooses."
 IND_expansion.11.a:0 "Put both settlements before the cabinet."
 IND_expansion.12.t:0 "No One on the Dais"
 IND_expansion.12.d:0 "The Regency Council opens its succession session beneath an empty chair. Harrison papers establish precedent, not a living sovereign; the treasury and court want permanence without risking a claimant who could dismiss them. The council can hold the crown as a trust or summon a convention authorized to search in public."
 IND_expansion.12.a:0 "The absence must acquire a law."
 IND_expansion.13.t:0 "The Last Working Copy"
 IND_expansion.13.d:0 "Pelley's archivists place the surviving working index on a Statehouse table. Some cards helped open the building; others record crimes the Silver State claims to have ended. County commanders want the files preserved against defectors. Younger cadres call them the machinery of the corrupt order they replaced."
 IND_expansion.13.a:0 "Decide what kind of government needs these cards."
 IND_expansion.14.t:0 "The Terre Haute Draft"
 IND_expansion.14.d:0 "Delegates meet in the restored Terre Haute hall with three drafts. The railroad brotherhoods protect their authority over crews, Gary demands control inside the mills, and the reconstruction board wants quotas it can enforce. Hapgood strikes the rhetorical preamble and keeps the articles that say who may stop a train, close a mine, and command an armed local."
 IND_expansion.14.a:0 "Send the working articles to the Congress."

