 IND_paul_v_mcnutt:0 "Paul V. McNutt"
 IND_frank_m_mchale:0 "Frank M. McHale"
 IND_frank_m_mchale_desc:0 "McNutt's lawyer, organizer, and principal political operator. McHale makes the eight executive departments answer together; he also makes each department dependent upon his telephone book."
 IND_harrison_continuity_council:0 "Harrison Regency Council"
 IND_william_dudley_pelley:0 "William Dudley Pelley"
 IND_powers_hapgood:0 "Powers Hapgood"

 STATE_1082:0 "Calumet"
 STATE_1083:0 "Northeast Indiana"
 STATE_1084:0 "Southern Indiana"
 VICTORY_POINTS_6713:0 "Gary"
 VICTORY_POINTS_11637:0 "Fort Wayne"
 VICTORY_POINTS_9654:0 "South Bend"
 VICTORY_POINTS_11635:0 "Evansville"
 VICTORY_POINTS_12437:0 "Terre Haute"

 IND_state_in_suspension:0 "A State in Suspension"
 IND_state_in_suspension_desc:0 "McNutt's eight departments still issue orders, but the legal theory beneath them ends at a War Department federalization notice that Indianapolis refuses to acknowledge. The Two Percent Club keeps the payroll organization loyal while the approaching end of McNutt's term leaves every appointment conditional."
 IND_wabash_emergency:0 "The Wabash Emergency"
 IND_wabash_emergency_desc:0 "The 1935 general strike ended after forty-eight hours; martial law in Vigo County did not. The Guard holds the courthouse and telephone exchange while Local 19694, the railroad brotherhoods, and relief committees preserve an organization beneath the occupation."
 IND_federal_embargo:0 "The Federal Embargo"
 IND_federal_embargo_desc:0 "Washington has built no customs wall. Railroad certificates, bank clearances, insurance forms, and federal contracts are simply delayed in different offices. Gary waits for ore, Allison waits for buyers, and no single Indiana concession can release every shipment."
 IND_consortium_credit:0 "Consortium Credit"
 IND_consortium_credit_desc:0 "A Chicago holding company advances the money that keeps Indiana's payroll current. Its beneficial owners, gathered privately as the 1816 Society, receive warehouse receipts, revenue schedules, and increasingly specific information about the government securing their notes."

 IND_harrison_regency:0 "The Harrison Regency"
 IND_harrison_regency_desc:0 "The Continuity Act placed the Harrison name above the eight executive departments and called the arrangement a regency pending convention. The 1816 Society holds the notes, the General Assembly holds the petition, and the Guard holds the Statehouse."
 IND_silver_administration:0 "The Silver Administration"
 IND_silver_administration_desc:0 "Pelley's Indianapolis government rests on copied obligations, converted county chairmen, and a Statehouse detail selected before the proclamation. The Silver Legion possesses the offices of Indiana; it has not made their occupants trust one another."
 IND_wabash_provisional_government:0 "The Wabash Provisional Government"
 IND_wabash_provisional_government_desc:0 "The Wabash Congress claims authority through strike committees, mine locals, and the Calumet delegates who answered Terre Haute's call. Its legitimacy will be measured first along Indiana's rail lines and courthouse squares."
 IND_federal_standoff:0 "The Federal Standoff"
 IND_federal_standoff_desc:0 "Washington now knows which government holds Indianapolis, but recognition has not followed. Federal offices still obstruct credit and freight while both sides avoid issuing the order that would turn administrative coercion into open war."
 IND_purdue_state_program:0 "The Purdue State Program"
 IND_purdue_state_program_desc:0 "Karl Lark-Horovitz's instrument shops at West Lafayette receive state purchasing priority and a protected research appropriation. The arrangement accelerates every laboratory that can justify its work to the committee and makes secrecy another charge against Indiana's strained economy."
 IND_west_lafayette_understanding:0 "The West Lafayette Understanding"
 IND_west_lafayette_understanding_desc:0 "Purdue's accelerator program operates under published university ownership and a narrow federal inspection agreement. Washington has relaxed the embargo without recognizing Indianapolis, while Indiana has admitted inspectors without conceding the Guard dispute."
 IND_special_services_without_agency:0 "The Special Services Section"
 IND_special_services_without_agency_desc:0 "A small office in the Adjutant General's building now collates railroad reports, State Police files, and intercepted federal procurement notices. It lacks the foreign stations of a true intelligence service but gives Indiana one address for information previously scattered across departments."

 IND_a_state_in_suspension:0 "A State in Suspension"
 IND_a_state_in_suspension_desc:0 "The Terre Haute occupation, the disputed federalization order, and the Chicago note are one political crisis. McNutt can no longer solve each file separately. The Statehouse must decide which organized force will inherit the emergency."

 IND_the_harrison_offer:0 "The Harrison Offer"
 IND_the_harrison_offer_desc:0 "The 1816 Society proposes to convert its credit into a continuity government organized around the Harrison name. The plan offers solvency, a constitutional fiction, and an American crown assembled in the rooms of the Columbia Club."
 IND_the_harrison_offer_tt:0 "§YCommits Indiana to the Harrison Crown route.§! The Pelley and Wabash branches will close. A single §YPolitical Crisis§! category will guide the necessary steps."
 IND_the_silver_entry:0 "The Silver Entry"
 IND_the_silver_entry_desc:0 "William Dudley Pelley's Asheville office has obtained copies from the remains of D. C. Stephenson's organization. The Silver Shirts will not march on Indianapolis; they will enter through county committees, payroll obligations, and doors opened from inside."
 IND_the_silver_entry_tt:0 "§YCommits Indiana to Pelley's subversive route.§! The Harrison and Wabash branches will close. A single §YPolitical Crisis§! category will guide the necessary steps."
 IND_the_wabash_answer:0 "The Wabash Answer"
 IND_the_wabash_answer_desc:0 "Powers Hapgood and the surviving Terre Haute committees reject both McNutt's Machine and the 1816 Society's creditors. Their route to power runs through relief kitchens, mine roads, and an armed challenge to the Statehouse."
 IND_the_wabash_answer_tt:0 "§YCommits Indiana to the communist route.§! The Harrison and Pelley branches will close. Preparation will culminate in a §Rcivil war§!."

 IND_accounts_behind_the_flag:0 "Accounts Behind the Flag"
 IND_accounts_behind_the_flag_desc:0 "The State Treasurer will identify which Chicago advances can be renewed and what the guarantors expect in return. The 1816 Society must become an institution the Statehouse can bargain with before it can become an institution that rules."
 IND_accounts_behind_the_flag_tt:0 "Reveals §YCommit the Guarantors§! in the Political Crisis category."
 IND_the_harrison_name:0 "The Harrison Name"
 IND_the_harrison_name_desc:0 "Russell Harrison carries a signer of the Declaration, Tippecanoe, and a former president in his family ledger. The Continuity Committee needs more than ancestry: it needs a petition describing why ordinary succession has become impossible."
 IND_the_harrison_name_tt:0 "Reveals §YPut the Petition in Writing§! in the Political Crisis category."
 IND_orders_to_the_adjutant_general:0 "Orders to the Adjutant General"
 IND_orders_to_the_adjutant_general_desc:0 "A crown proclaimed without the Guard would be a Columbia Club dinner carried too far. The Continuity Committee must determine which commissions Indiana's officers will honor when two authorities send orders to Indianapolis."
 IND_orders_to_the_adjutant_general_tt:0 "Reveals §YSecure the Statehouse§! in the Political Crisis category."
 IND_an_american_crown:0 "An American Crown"
 IND_an_american_crown_desc:0 "The notes have been renewed, the petition signed, and the Statehouse detail settled. The Continuity Act can now place the Harrison Regency above McNutt's departments and ask Indiana to accept hereditary authority as the price of administrative survival."
 IND_an_american_crown_tt:0 "The §YHarrison Regency Council§! takes power. Indiana becomes §YNon-Aligned§! and elections are suspended."

 IND_a_letter_from_asheville:0 "A Letter from Asheville"
 IND_a_letter_from_asheville_desc:0 "Pelley's correspondent offers photographed pages naming former Klan officers, county chairmen, ministers, and policemen. The archive is incomplete, but a subversive government needs obligations more than it needs a complete history."
 IND_a_letter_from_asheville_tt:0 "Reveals §YCopy the County Index§! in the Political Crisis category."
 IND_a_sermon_for_indianapolis:0 "A Sermon for Indianapolis"
 IND_a_sermon_for_indianapolis_desc:0 "The Silver Legion will translate Pelley's conspiratorial theology and antisemitism into the language of Indiana's emergency: federal persecution, betrayed veterans, and a Statehouse surrounded by secret enemies. County organizers will receive the political version, not the Asheville original."
 IND_a_sermon_for_indianapolis_tt:0 "Reveals §YBind the County Chairmen§! in the Political Crisis category."
 IND_the_night_detail:0 "The Night Detail"
 IND_the_night_detail_desc:0 "The State Police schedule identifies which men hold the east doors, the telephone room, and the Governor's elevator after midnight. Pelley's seizure depends on replacing a few names without giving McNutt a reason to inspect the entire roster."
 IND_the_night_detail_tt:0 "Reveals §YReplace the Night Watch§! in the Political Crisis category."
 IND_the_silver_state:0 "The Silver State"
 IND_the_silver_state_desc:0 "The copied index has disciplined the county chairmen, the county chairmen have supplied respectable petitioners, and the night detail has supplied the keys. Pelley can take the microphone before Indiana understands that an administration has changed."
 IND_the_silver_state_tt:0 "§YWilliam Dudley Pelley§! seizes the government without a civil war. Indiana becomes §YFascist§! and elections are suspended."

 IND_the_house_on_north_eighth:0 "The House on North Eighth"
 IND_the_house_on_north_eighth_desc:0 "The Debs house gives Terre Haute's committees an address that martial law cannot make obscure. Hapgood will use it to connect Local 19694, railroad brotherhood men, and unemployed miners without pretending those organizations already share a command."
 IND_the_house_on_north_eighth_tt:0 "Reveals §YReopen the Relief Kitchens§! in the Political Crisis category."
 IND_the_mine_roads:0 "The Mine Roads"
 IND_the_mine_roads_desc:0 "Vigo and Clay County roads cross union halls, abandoned workings, and farms whose trucks already carry relief coal. The same network can move rifles, but every crate converted from relief to war reduces the fiction that this remains a political campaign."
 IND_the_mine_roads_tt:0 "Reveals §YMove Arms Through the Mine Roads§! in the Political Crisis category."
 IND_the_calumet_vote:0 "The Calumet Vote"
 IND_the_calumet_vote_desc:0 "A Terre Haute revolt cannot govern Gary by invoking Eugene Debs. Delegates from the steel locals and East Chicago must decide whether the Wabash committees speak for an Indiana movement or only for an occupied county."
 IND_the_calumet_vote_tt:0 "Reveals §YCall the Wabash Congress§! in the Political Crisis category."
 IND_the_wabash_congress:0 "The Wabash Congress"
 IND_the_wabash_congress_desc:0 "The delegates have voted, the mine roads are open, and the relief committees can mobilize families as well as pickets. Hapgood will proclaim a provisional government in Terre Haute and force McNutt's Statehouse to answer with troops."
 IND_the_wabash_congress_tt:0 "§YPowers Hapgood§! forms a Communist government and begins the §RWabash Civil War§!. Purdue content remains locked until the war is won."

 IND_a_government_washington_can_name:0 "A Government Washington Can Name"
 IND_a_government_washington_can_name_desc:0 "Indiana's political struggle has produced one authority capable of signing an order, paying the departments, and answering a federal envelope. Washington need not recognize that government to admit that it exists."
 IND_a_government_washington_can_name_tt:0 "Ends the opening political crisis, removes its starting national spirits, and replaces the §YFederal Embargo§! with the simpler §YFederal Standoff§!."
 IND_the_special_services_section:0 "The Special Services Section"
 IND_the_special_services_section_desc:0 "Railroad reports, State Police intercepts, and War Department procurement notices require one office. The Adjutant General will establish a Special Services Section before Washington's administrative pressure becomes a military plan."
 IND_the_special_services_section_tt:0 "Creates an §YIntelligence Agency§! with La Résistance. Without that expansion, adds §YThe Special Services Section§! national spirit. Political Power §R-25§!."
 IND_whispers_from_west_lafayette:0 "Whispers from West Lafayette"
 IND_whispers_from_west_lafayette_desc:0 "A purchasing anomaly at Purdue mentions magnet steel, vacuum pumps, and high-voltage equipment. The invoice is not a weapon and the physicists have made no political offer. It is enough to send an engineer to West Lafayette without placing the request in ordinary correspondence."
 IND_whispers_from_west_lafayette_tt:0 "Reveals Purdue's accelerator program. Requires a settled Indiana government."
 IND_keep_the_furnaces_lit:0 "Keep the Furnaces Lit"
 IND_keep_the_furnaces_lit_desc:0 "Gary Works cannot wait for constitutional recognition to decide which furnaces receive ore. Indiana will guarantee one military conversion line and use state rail priorities to keep it supplied."
 IND_keep_the_furnaces_lit_tt:0 "Adds §G1 Military Factory§! and §G1 building slot§! in §YCalumet§!."
 IND_the_west_lafayette_memorandum:0 "The West Lafayette Memorandum"
 IND_the_west_lafayette_memorandum_desc:0 "Karl Lark-Horovitz can finish Purdue's machines faster with state purchasing authority. Washington can obstruct that authority or inspect what it produces, but it can no longer dismiss the Physics Building as an ordinary university account."
 IND_the_west_lafayette_memorandum_tt:0 "Choose between a secret state program and an open inspection agreement. Both end the §YFederal Standoff§! and accelerate nuclear research; the costs and long-term benefits differ."

 IND_the_political_crisis:0 "The Political Crisis"
 IND_the_political_crisis_desc:0 "The chosen organization requires three operations before it can take power. Only the next operation appears. Each completed operation opens the next political focus."

 IND_crown_commit_the_guarantors:0 "Commit the Guarantors"
 IND_crown_commit_the_guarantors_desc:0 "Renew the Chicago advances through named members of the 1816 Society and accept their inspection rights over pledged Indiana receipts."
 IND_crown_commit_the_guarantors_tt:0 "After §Y20 days§!: gain §G1 off-map Civilian Factory§! and Stability §R-1%§!."
 IND_crown_put_the_petition_in_writing:0 "Put the Petition in Writing"
 IND_crown_put_the_petition_in_writing_desc:0 "Have the Continuity Committee circulate a single constitutional petition through the General Assembly instead of collecting private promises in the Columbia Club."
 IND_crown_put_the_petition_in_writing_tt:0 "After §Y20 days§!: the Harrison petition is secured and Stability §G+2%§!."
 IND_crown_secure_the_statehouse:0 "Secure the Statehouse"
 IND_crown_secure_the_statehouse_desc:0 "Transfer the Statehouse detail to officers who have accepted the Continuity Committee's interpretation of their Indiana commissions."
 IND_crown_secure_the_statehouse_tt:0 "After §Y25 days§!: gain §G10 Army Experience§! and Stability §R-2%§!."

 IND_pelley_copy_the_county_index:0 "Copy the County Index"
 IND_pelley_copy_the_county_index_desc:0 "Photograph the useful pages from Stephenson's surviving files and return the originals before the Attorney General records their absence."
 IND_pelley_copy_the_county_index_tt:0 "After §Y20 days§!: Fascist Popularity §G+2%§! and Stability §R-1%§!."
 IND_pelley_bind_the_county_chairmen:0 "Bind the County Chairmen"
 IND_pelley_bind_the_county_chairmen_desc:0 "Confront selected Machine officials with their old signatures and offer them a place in the organization that will protect those records."
 IND_pelley_bind_the_county_chairmen_tt:0 "After §Y20 days§!: Political Power §G+25§! and Stability §R-2%§!."
 IND_pelley_replace_the_night_watch:0 "Replace the Night Watch"
 IND_pelley_replace_the_night_watch_desc:0 "Move Silver Legion sympathizers into the Statehouse telephone room, east entrance, and midnight motor detail through ordinary personnel orders."
 IND_pelley_replace_the_night_watch_tt:0 "After §Y25 days§!: Fascist Popularity §G+3%§! and Stability §R-2%§!."

 IND_communist_reopen_the_relief_kitchens:0 "Reopen the Relief Kitchens"
 IND_communist_reopen_the_relief_kitchens_desc:0 "Restore the Vigo County kitchens as legal relief stations and use their delivery lists to reconnect families scattered by the Guard occupation."
 IND_communist_reopen_the_relief_kitchens_tt:0 "After §Y20 days§!: Communist Popularity §G+2%§! and Stability §G+1%§!."
 IND_communist_move_arms_through_the_mine_roads:0 "Move Arms Through the Mine Roads"
 IND_communist_move_arms_through_the_mine_roads_desc:0 "Divert rifles through the coal and relief routes between Terre Haute, Brazil, and the southern edge of the Calumet network."
 IND_communist_move_arms_through_the_mine_roads_tt:0 "After §Y20 days§!: add §G400 Infantry Equipment§! and War Support §G+2%§!."
 IND_communist_call_the_wabash_congress:0 "Call the Wabash Congress"
 IND_communist_call_the_wabash_congress_desc:0 "Bring Terre Haute, railroad, mining, and Calumet delegates into one convention and require every organization to vote publicly on an armed challenge."
 IND_communist_call_the_wabash_congress_tt:0 "After §Y25 days§!: Communist Popularity §G+5%§! and War Support §G+5%§!."

 IND_intro.1.t:0 "The January File"
 IND_intro.1.d:0 "The Supreme Court did not merely wound Franklin Roosevelt's recovery program. A broader series of decisions dismantled the federal machinery through which relief money, labor policy, and industrial credit reached Indiana. Governor Paul V. McNutt answered by using the Executive Reorganization Act of 1933 as an emergency constitution. Eight departments, a disciplined Democratic organization, and assessments collected through the Hoosier Democratic Club allowed Indianapolis to keep issuing orders after Washington's programs failed.\n\nThe break came in Terre Haute. McNutt's National Guard ended the 1935 general strike and continued occupying Vigo County. Roosevelt ordered the Guard federalized. Attorney General Philip Lutz returned a request for statutory clarification; the final acknowledgement never left the Statehouse. Indiana continued governing, Washington began obstructing its freight and credit, and neither side supplied the document that would make the separation legally clean.\n\nThis briefing contains one additional page. Reading or skipping it changes nothing."
 IND_intro.1.a:0 "Open the situation report."
 IND_intro.1.b:0 "Begin at the Statehouse."
 IND_intro.2.t:0 "Indiana, 1 January 1936"
 IND_intro.2.d:0 "McNutt begins the year with three emergencies and one borrowed advantage. The Guard still controls the Vigo County Courthouse and telephone exchange, but Local 19694 and the railroad brotherhoods retain enough organization to resist. Federal agencies delay railroad certificates, bank clearances, and procurement contracts without declaring a blockade. A Chicago holding company keeps Indiana's payroll current through advances secured against receipts that the Constitution of 1851 never intended to pledge.\n\nBehind the credit stands the 1816 Society, whose members believe private finance can replace federal recovery and whose lawyers have begun studying the Harrison family. Elsewhere, William Dudley Pelley's Silver Legion seeks surviving records from D. C. Stephenson's political network. Powers Hapgood works through labor and relief organizations beyond the reach of McNutt's Machine. Each group possesses something the state needs: money, compromised officials, or organized men.\n\nMcNutt can admit only one of them close enough to resolve the emergency. The same access that supplies credit, compromised officers, or organized workers will give that faction the means to replace him."
 IND_intro.2.a:0 "Close the file."

 IND_opening.2.t:0 "Three Folders, One Desk"
 IND_opening.2.d:0 "Frank McHale placed three folders on the Governor's desk after the department directors left. The first contained the Chicago renewal schedule and a memorandum from the Harrison Continuity Committee. The second contained photographed names from Stephenson's county organization and a return address in Asheville. The third contained State Police reports from North Eighth Street, where relief committees were meeting despite the Terre Haute occupation.\n\nMcNutt could continue answering each emergency through his eight departments, but the departments no longer supplied money, secrecy, and obedience on their own. One outside organization would have to be admitted close enough to solve the crisis. Once admitted, it would also be close enough to inherit the state."
 IND_opening.2.a:0 "Choose which folder remains on the desk."

 IND_1816.1.t:0 "The Harrison Offer"
 IND_1816.1.d:0 "The note from Chicago arrived inside an envelope bearing no bank letterhead. It offered renewal through the end of the federal dispute if Indiana created a Continuity Committee empowered to inspect pledged receipts and prepare the 1937 succession. A second sheet listed the proposed public members: lawyers, insurance officers, two legislators, and representatives of the Harrison family.\n\nNo sentence used the word crown. The legal memorandum did. Its authors argued that the Constitution of 1851 could not compel an ordinary transfer of executive power while the status of the Guard—and therefore the identity of the lawful commander—remained disputed. The committee would preserve the departments until a convention supplied a permanent answer. The 1816 Society would preserve the payroll until the committee existed."
 IND_1816.1.a:0 "Give the committee a room in the Statehouse."
 IND_1816.2.t:0 "Accounts Behind the Flag"
 IND_1816.2.d:0 "The State Treasurer's clerks matched warehouse receipts against the Chicago advances and found that the public holding company was less important than four guarantors behind it. One controlled insurance reserves in Indianapolis. One cleared grain paper through LaSalle Street. One held contracts supplying Gary Works. The fourth appeared only through a voting trust represented at the Columbia Club.\n\nThey did not ask for ministries. They asked to inspect the revenue schedules securing their money and to approve any new obligation maturing after McNutt's term. The distinction mattered to the General Assembly and very little to the departments whose payroll depended on renewal. Committing the guarantors would buy a functioning treasury and record who had purchased the option on Indiana's next government."
 IND_1816.2.a:0 "Obtain the guarantors' signatures."
 IND_1816.3.t:0 "The Harrison Name"
 IND_1816.3.d:0 "Russell Harrison received the committee in a private room at the Columbia Club. At eighty-one he had no patience for a costume monarchy, but he understood what his surname offered: Benjamin Harrison had occupied the White House, William Henry Harrison had carried Tippecanoe into national mythology, and an earlier Benjamin had signed the Declaration.\n\nThe committee proposed a regency rather than an immediate coronation. Its petition would claim that the emergency required a hereditary point of continuity above the departments, while a later convention settled titles and succession. Harrison corrected two claims about his father's administration, struck a paragraph comparing Indiana to Europe, and agreed that the petition could circulate with the family's knowledge. He did not agree to let Frank McHale write it."
 IND_1816.3.a:0 "Put the constitutional claim on paper."
 IND_1816.4.t:0 "Orders to the Adjutant General"
 IND_1816.4.d:0 "Guard headquarters compared three documents: McNutt's state commission, Roosevelt's unacknowledged federalization order, and the Continuity Committee's draft proclamation. None told a company commander what to do if different men occupied the Governor's office and the War Department telephone rang.\n\nThe Adjutant General refused a general oath. He would accept written orders naming the Statehouse, arsenal, and telephone exchange as installations to be held against unauthorized entry. Officers who signed those orders would not swear loyalty to a crown; they would make the crown possible by deciding in advance which doors remained closed. The committee needed only the Indianapolis detail. Asking for more risked dividing the 38th Division before the government changed."
 IND_1816.4.a:0 "Secure the buildings that make an order real."
 IND_1816.20.t:0 "An American Crown"
 IND_1816.20.d:0 "The General Assembly met beneath galleries filled with county chairmen, creditors, and uniformed officers who had received different explanations for the same session. The Continuity Petition declared that the unresolved federalization order made ordinary succession impossible. The accompanying act placed executive authority in a Harrison Regency Council until an Indiana convention could settle the crown and its succession.\n\nMcNutt read the tally from the clerk's desk. The organization he had built held: department directors reported, payroll warrants cleared, and the Guard kept the east doors shut. None of those instruments now required him. Frank McHale had treated the 1816 Society as another creditor to be ridden through the emergency; the creditor had purchased the stable, the harness, and the office that issued riding orders.\n\nThe council took the executive seal without a coronation. Russell Harrison remained at the Columbia Club while its lawyers signed the first proclamation in his family's name. Indiana had acquired a crown by ledger, petition, and guard roster."
 IND_1816.20.a:0 "Proclaim the Harrison Regency."
 IND_1816_20_a_tt:0 "The §YHarrison Regency Council§! becomes country leader; the ruling party becomes §YNon-Aligned§!; elections end; add §YThe Harrison Regency§!; Stability §R-3%§!."

 IND_black_boxes.1.t:0 "The Silver Entry"
 IND_black_boxes.1.d:0 "The first Asheville envelope contained no Silver Shirt pamphlet. It held a photographed index page from the remains of D. C. Stephenson's organization: a county chairman, two ministers, a former State Police officer, and payments associated with the 1924 campaign. Frank McHale recognized enough names to understand why the sender had chosen him.\n\nPelley's proposal was practical. His people would identify which old obligations still reached active offices. McHale's people would keep the Attorney General from assembling a complete chain of custody. In return, a small number of Silver Legion organizers would receive introductions as veterans' speakers and anti-federal petitioners. No march, uniform, or public alliance was requested. The Silver Shirts intended to enter Indiana dressed as correspondence."
 IND_black_boxes.1.a:0 "Let the return mail pass through Richmond."
 IND_black_boxes.2.t:0 "A Letter from Asheville"
 IND_black_boxes.2.d:0 "The courier brought three kinds of paper. Stephenson's pages supplied old names. Hoosier Democratic Club receipts supplied current jobs. Silver Legion questionnaires supplied resentments that could connect the two. The resulting county index did not prove a single conspiracy; it showed which men could be persuaded that another person possessed proof.\n\nThe Attorney General still held the strongest legal position. If his office received the originals, much of the archive could be authenticated and sealed. Pelley therefore asked only for copies and insisted that every borrowed page return to its box before the next prison inventory. Subversion depended on the Statehouse continuing to believe that possession and control were the same thing."
 IND_black_boxes.2.a:0 "Copy what can be used and return what can be counted."
 IND_black_boxes.3.t:0 "A Sermon for Indianapolis"
 IND_black_boxes.3.d:0 "Pelley's Asheville draft blamed Jewish financiers, Roosevelt's advisers, communists, and an occult struggle described at much greater length than any Indiana organizer could use. The Indianapolis version removed the mysticism but preserved the antisemitism and the claim that federal power served a concealed enemy. It added the veterans' bonus, the Terre Haute occupation, and the embargo on Gary freight.\n\nMinisters received a defense of Christian government. Former Klansmen received a warning that the old files were about to become federal evidence. Machine chairmen received a list of federal offices supposedly preparing their arrest. The versions contradicted one another because they were not meant to be compared. Their shared instruction was simple: attend the county meeting, sign the emergency petition, and accept the man from Indianapolis as chairman."
 IND_black_boxes.3.a:0 "Send each county the version prepared for it."
 IND_black_boxes.4.t:0 "The Night Detail"
 IND_black_boxes.4.d:0 "The Statehouse watch roster changed through six ordinary personnel orders. A transfer from the Capitol Police put a Silver Legion veteran at the east entrance. A Highway Department appointment moved another man into the telephone room. Two absences placed substitutes beside the Governor's elevator. The motor-pool dispatcher owed his position to a county chairman whose signature appeared in the copied index.\n\nNo unit defected and no armory opened. That was the purpose. A coup announced through marching columns would force McNutt to discover whether the Guard still obeyed him. A locked telephone room required him to discover only that his calls no longer left the building."
 IND_black_boxes.4.a:0 "Change the roster without changing the uniform."
 IND_black_boxes.20.t:0 "The Silver State"
 IND_black_boxes.20.d:0 "WFBM received the proclamation before the Governor did. It announced that an emergency citizens' committee had assumed temporary authority after uncovering a plot among federal agents, communist organizers, and compromised state officials. County chairmen named in Stephenson's papers telephoned their support. Ministers read prepared statements. State Police at the east doors admitted Pelley's delegation and informed McNutt that the telephone exchange was under protective control.\n\nThe Governor reached Frank McHale through a private line that had not appeared on the roster. McHale could still call department directors, but each director had already received a copy of his own name in someone else's file. The Machine had been built to transmit one decision through every office. Pelley captured it by making every office uncertain who possessed the receipt for its obedience.\n\nThere was no battle for Indianapolis. Silver Shirts appeared on Monument Circle only after the executive seal, radio microphone, and Statehouse guard had changed hands."
 IND_black_boxes.20.a:0 "Broadcast Pelley's emergency proclamation."
 IND_black_boxes_20_a_tt:0 "§YWilliam Dudley Pelley§! becomes country leader; the ruling party becomes §YFascist§!; elections end; add §YThe Silver Administration§!; Stability §R-5%§!."

 IND_terre_haute.1.t:0 "The Wabash Answer"
 IND_terre_haute.1.d:0 "Powers Hapgood met the Terre Haute delegation at the Debs house rather than the occupied union hall. Local 19694 could still name officers, the railroad brotherhoods could still delay a freight movement, and relief committees knew which families had survived the months after the general strike. None of them accepted the Statehouse's claim that private credit or a different executive title would settle the Guard occupation.\n\nHapgood proposed an organization outside McNutt's departments: kitchens first, transport second, delegates third. It would remain public wherever public work protected it and clandestine wherever the State Police made legality impossible. Unlike the Harrison committee or Pelley's correspondents, it could not inherit Indianapolis by obtaining a key. If it challenged the Statehouse, men carrying rifles would decide which government survived."
 IND_terre_haute.1.a:0 "Build the organization that can survive that answer."
 IND_terre_haute.2.t:0 "The House on North Eighth"
 IND_terre_haute.2.d:0 "The Eugene V. Debs house supplied an address, a visitors' book, and a name the Guard could not dismiss as an invention of 1935. Relief organizers entered through the front door with grocery accounts. Local 19694 officers used the kitchen. Railroad men arrived separately and left no minutes.\n\nHapgood refused to call the group a party committee. The occupation had scattered members across unions, unemployed leagues, fraternal halls, and mine settlements; pretending to command them would only give State Police one organization to break. Reopening the kitchens would test whether those people still followed the same delivery routes. Flour, coal, and eviction notices would establish the network before rifles asked it to carry anything else."
 IND_terre_haute.2.a:0 "Begin again with the relief lists."
 IND_terre_haute.3.t:0 "The Mine Roads"
 IND_terre_haute.3.d:0 "A truck leaving Terre Haute for Brazil could carry flour openly, blasting supplies with a permit, or rifles beneath either cargo. The mine locals knew which roads avoided Guard checkpoints and which sheriffs treated a union card as evidence. Railroad men offered faster movement north, but a single inspected freight car could expose every name on its waybill.\n\nHapgood chose the slower network. Small consignments would move through relief depots and abandoned workings, with no local receiving enough to arm itself before the Wabash Congress met. The decision limited what the revolt could field on its first day. It also prevented one frightened courier from surrendering the entire arsenal to McNutt's police."
 IND_terre_haute.3.a:0 "Move small crates and keep no central ledger."
 IND_terre_haute.4.t:0 "The Calumet Vote"
 IND_terre_haute.4.d:0 "Delegates from Gary and East Chicago objected to the name Wabash Congress before they objected to the revolt. Terre Haute's memory centered on the 1935 strike and the Guard occupation. Calumet workers faced U.S. Steel, ethnic divisions inside the mills, and federal agents who could cross from Chicago without passing an Indiana county sheriff.\n\nThe steel delegates demanded seats by organization rather than by county and control over any arms moved north of the Kankakee. Hapgood accepted both conditions. In return, the Calumet delegation agreed that a Statehouse attack on the Terre Haute committees would be treated as an attack on the Congress. The vote did not create ideological unity. It created a rule for entering the same war."
 IND_terre_haute.4.a:0 "Call the Congress on those terms."
 IND_terre_haute.20.t:0 "The Wabash Congress"
 IND_terre_haute.20.d:0 "Delegates assembled in Terre Haute while Guard patrols still controlled the courthouse. Local 19694 called the roll. Mine representatives reported which roads were open. Calumet delegates confirmed that the night shifts had received the signal. Hapgood read a declaration accusing McNutt's government of maintaining martial law for creditors and administering independence through the same payroll machinery that had served the Democratic Machine.\n\nThe Congress proclaimed a provisional government and ordered sympathetic locals to seize municipal buildings, telephone exchanges, and railroad yards. Indianapolis answered before dawn. The Adjutant General directed loyal units toward Vigo County and ordered the Statehouse arsenal closed. County sheriffs began choosing which document carried lawful authority by deciding which messengers they allowed through the door.\n\nThis was not a strike settlement or a January transfer of office. Indiana now had two governments and enough organized men to require one of them to defeat the other."
 IND_terre_haute.20.a:0 "Raise the red flag over Vigo County."
 IND_terre_haute_20_a_tt:0 "§YPowers Hapgood§! leads the Communist government. A Democratic opposition receives roughly §Y35%§! of Indiana and the §RWabash Civil War§! begins."

 IND_1937.1.t:0 "The Address on the Envelope"
 IND_1937.1.d_crown:0 "The next War Department memorandum was addressed to the Harrison Regency Council at Indianapolis. No royal title appeared and no recognition accompanied the correction, but Washington had admitted which authority could answer for the Guard."
 IND_1937.1.d_pelley:0 "The next Treasury memorandum was addressed to William Dudley Pelley's administration at Indianapolis. Washington condemned the seizure in a separate statement; the envelope nevertheless admitted which office controlled Indiana's receipts."
 IND_1937.1.d_communist:0 "After the last organized Statehouse resistance ended, the next federal memorandum was addressed to the Wabash Provisional Government at Indianapolis. Washington recognized neither its revolution nor its independence, but the old governor's name had disappeared."
 IND_1937.1.a:0 "One government now answers for Indiana."

 IND_purdue.1.t:0 "Freight for the Physics Building"
 IND_purdue.1.d:0 "The Special Services clerk noticed the shipment because three federal offices had reviewed it and none had stopped it. Magnet steel, copper conductor, vacuum equipment, and glassware were consigned to the Physics Building at Purdue. The invoice referred to work begun by Hubert Yearian and instrument maker John Howe under Karl Lark-Horovitz. A second account concerned a high-voltage machine being assembled by graduate students with Purdue Research Foundation money.\n\nPurdue had decided in 1935 to build both a Van de Graaff accelerator and a cyclotron. Its shops, faculty labor, and a cyclotron budget below ten thousand dollars made the machines possible. Under the federal standoff, the same equipment acquired political value. Washington could obstruct replacement parts; Indiana could give the project purchasing priority; neither side wanted the other to control the first serious nuclear laboratory between Chicago and the Ohio River.\n\nNo physicist had promised a bomb. The memorandum said only that atomic disintegration work would begin sooner if procurement stopped passing through three hostile accounting systems."
 IND_purdue.1.a:0 "Send an engineer, not a letter."
 IND_purdue.2.t:0 "The West Lafayette Memorandum"
 IND_purdue.2.d:0 "Karl Lark-Horovitz received the Statehouse engineer in the Physics Building's instrument shop. Purdue had expanded that shop precisely because the department could not afford to purchase every apparatus it needed. Yearian and Howe could build the cyclotron magnet; graduate students could assemble the Van de Graaff; the missing resource was a government able to move copper, steel, and vacuum components without reopening each order in Washington.\n\nLark-Horovitz offered two arrangements. A secret state contract would place procurement through Indianapolis, accelerate the entire research program, and prevent federal inspectors from learning which measurements Purdue prioritized. An open university agreement would publish the equipment list and admit a small Bureau of Standards delegation in exchange for clearing scientific freight. The first produced a stronger Indiana program and another concealed account. The second gave Washington access while creating a face-saving reason to relax the embargo.\n\nNeither arrangement produced an atomic weapon. Both put Indiana years earlier on the chain of accelerators, neutron work, isotope production, and industrial coordination from which such a weapon might eventually become possible."
 IND_purdue.2.a:0 "Put the program under state contract."
 IND_purdue.2.b:0 "Trade inspection for an open scientific corridor."
 IND_purdue_2_a_tt:0 "Political Power §R-75§!; end §YThe Federal Standoff§!; add §YThe Purdue State Program§!; gain one §G50% Nuclear Research§! bonus."
 IND_purdue_2_b_tt:0 "Political Power §R-25§!; Stability §G+2%§!; end §YThe Federal Standoff§!; add §YThe West Lafayette Understanding§!; gain one §G25% Nuclear Research§! bonus."
 IND_purdue_accelerator_bonus:0 "Purdue Accelerator Program"

